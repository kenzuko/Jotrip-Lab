<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#031722"><title>PHU QUOC: PIXEL ISLAND</title><style>html,body{margin:0;width:100%;height:100%;background:#031722;color:#fff;font-family:ui-monospace,monospace;display:grid;place-items:center;overflow:hidden}.loader{text-align:center}.loader b{display:block;color:#f4b72d;font-size:22px;margin-bottom:8px}.loader span{font-size:11px;color:#b8d2dd}</style></head><body><div class="loader" id="loader"><b>PHU QUOC: PIXEL ISLAND</b><span>LOADING ISLAND...</span></div><script>(async()=>{try{const parts=[];for(let i=1;i<=9;i++){const n=String(i).padStart(2,'0');const r=await fetch('/deploy-chunks/p'+n+'.b64?v=20260915',{cache:'no-store'});if(!r.ok)throw new Error('Missing deploy chunk '+n);parts.push((await r.text()).trim())}const b64=parts.join('');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('Browser gzip loader unavailable');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loader"><b>LOAD ERROR</b><span>'+String(e.message||e)+'</span></div>';console.error(e)}})();</script></body></html>
