<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#77944C">
  <title>JoTrip Lab</title>
  <style>
    :root { color-scheme: light; --green:#77944C; --yellow:#FCBC12; --ink:#183028; --paper:#F7F7F2; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(720px,100%); background:white; border:1px solid rgba(24,48,40,.1); border-radius:28px; padding:clamp(28px,6vw,56px); box-shadow:0 24px 70px rgba(24,48,40,.09); }
    .mark { display:inline-flex; align-items:center; gap:10px; font-weight:800; letter-spacing:-.03em; font-size:clamp(28px,6vw,44px); }
    .dot { width:.7em; height:.7em; border-radius:999px; background:var(--yellow); box-shadow:.48em 0 0 var(--green); margin-right:.48em; }
    h1 { margin:42px 0 14px; font-size:clamp(38px,8vw,72px); line-height:.98; letter-spacing:-.055em; }
    p { margin:0; max-width:52ch; color:#53635d; font-size:clamp(17px,2.5vw,20px); line-height:1.6; }
    .status { display:flex; align-items:center; gap:10px; margin-top:34px; padding-top:24px; border-top:1px solid rgba(24,48,40,.1); font-weight:700; }
    .pulse { width:10px; height:10px; border-radius:50%; background:var(--green); box-shadow:0 0 0 6px rgba(119,148,76,.14); }
  </style>
</head>
<body>
  <main>
    <div class="mark"><span class="dot" aria-hidden="true"></span>JoTrip</div>
    <h1>Lab is ready.</h1>
    <p>Không gian thử nghiệm website, dashboard và các ý tưởng số của JoTrip. Trang này xác nhận GitHub đã sẵn sàng để kết nối với Vercel.</p>
    <div class="status"><span class="pulse" aria-hidden="true"></span>GitHub pipeline connected</div>
  </main>
</body>
</html>
