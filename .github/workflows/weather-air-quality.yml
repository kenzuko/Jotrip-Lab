name: Weather Air Quality
# Environmental layer is isolated from weather/marine GO-HOLD logic.
# Live snapshots are persisted on data-weather so data refreshes do not trigger UI deploys.

on:
  push:
    paths:
      - "weather/collectors/cams_air_quality.py"
      - "weather/collectors/iqair_air_quality.py"
      - "weather/processing/air_quality.py"
      - "weather/processing/merge_air_quality.py"
      - ".github/workflows/weather-air-quality.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      target_ref:
        description: "Branch containing Weather Lab"
        required: false
        type: string
        default: "feat/weather-lab-data-engine-v1"
    secrets:
      ADS_API_KEY:
        required: false
      IQAIR_API_KEY:
        required: false

concurrency:
  group: weather-air-quality-${{ inputs.target_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DATA_BRANCH: data-weather
  DATA_ROOT: data/weather-aqi

jobs:
  air-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
      IQAIR_API_KEY: ${{ secrets.IQAIR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install current ADS PAT client and NetCDF readers
        run: python -m pip install --quiet "ecmwf-datastores-client==0.5.1" xarray netCDF4 numpy
      - name: Normalize ADS secret
        shell: bash
        run: |
          RAW="$ADS_API_KEY"
          CLEAN=$(printf '%s\n' "$RAW" | sed -nE 's/^[[:space:]]*key:[[:space:]]*["'\'']?([^"'\'']+)["'\'']?[[:space:]]*$/\1/p' | head -n 1)
          if [[ -z "$CLEAN" ]]; then
            CLEAN=$(printf '%s\n' "$RAW" | sed '/^[[:space:]]*url:/d;/^[[:space:]]*$/d' | head -n 1 | xargs)
          fi
          if [[ -n "$CLEAN" ]]; then
            echo "ADS_API_KEY=$CLEAN" >> "$GITHUB_ENV"
            echo "ADS token normalized without exposing its value"
          else
            echo "ADS token missing; IQAir can still publish AQI if configured"
          fi
      - name: Collect CAMS PM2.5 and PM10 model reference
        run: python -m weather.collectors.cams_air_quality --output /tmp/cams-air-quality.json
      - name: Collect optional IQAir realtime city AQI
        run: python -m weather.collectors.iqair_air_quality --output /tmp/iqair-air-quality.json
      - name: Merge observed-first AQI policy
        run: python -m weather.processing.merge_air_quality --cams /tmp/cams-air-quality.json --iqair /tmp/iqair-air-quality.json --output /tmp/air-quality.json
      - name: Validate environmental layer
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/air-quality.json'))
          assert p['status'] in {'POINT_NUMERIC_READY','PARTIAL','UNAVAILABLE'}, p
          if p['status'] == 'POINT_NUMERIC_READY':
              assert set(p['points']) == {'an_thoi','duong_dong','ganh_dau','rach_gia'}
              assert all(p['points'][k]['aqi_us'] is not None for k in p['points'])
              assert all(p['points'][k]['aqi_source'] in {'IQAIR_COMMUNITY_REALTIME','CAMS_GLOBAL_ANALYSIS'} for k in p['points'])
          PY
      - name: Persist usable AQI snapshot to isolated data branch
        shell: bash
        run: |
          STATUS=$(python -c 'import json; print(json.load(open("/tmp/air-quality.json"))["status"])')
          if [[ "$STATUS" != "POINT_NUMERIC_READY" ]]; then
            echo "AQI layer not fully ready ($STATUS); keeping last data-weather snapshot"
            cat /tmp/air-quality.json
            exit 0
          fi

          cp /tmp/air-quality.json /tmp/weather-aqi-latest.json
          git reset --hard HEAD
          git fetch origin "$DATA_BRANCH"
          git checkout -B "$DATA_BRANCH" "origin/$DATA_BRANCH"
          mkdir -p "$DATA_ROOT"
          cp /tmp/weather-aqi-latest.json "$DATA_ROOT/latest.json"
          git config user.name "jotrip-weather-bot"
          git config user.email "jotrip-weather-bot@users.noreply.github.com"
          git add "$DATA_ROOT/latest.json"
          if git diff --cached --quiet; then
            echo "Air-quality live snapshot unchanged"
            exit 0
          fi
          git commit -m "data: update observed-first AQI latest"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$DATA_BRANCH" && git push origin "HEAD:$DATA_BRANCH"; then
              echo "AQI latest persisted on data-weather attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Failed to persist AQI latest after 3 attempts"
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-air-quality
          path: |
            /tmp/air-quality.json
            /tmp/cams-air-quality.json
            /tmp/iqair-air-quality.json
          retention-days: 7
