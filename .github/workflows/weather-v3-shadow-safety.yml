name: Weather V3 shadow safety

on:
  push:
    paths:
      - "weather/config/observation_sources_v3.json"
      - "weather/processing/observation_mesh_v3.py"
      - "weather/processing/radar_motion_v3.py"
      - "weather/processing/event_skill_v3.py"
      - "weather/tests/test_observation_mesh_v3.py"
      - "weather/tests/test_v3_event_skill.py"
      - "weather/pipeline/run_v3_shadow_cycle.py"
      - "weather/tests/test_v3_shadow_cycle.py"
      - "weather/config/v3_runtime.json"
      - "WEATHER_ENGINE_V3_OBSERVATION_NOWCAST_MASTER.md"
      - ".github/workflows/weather-v3-shadow-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate V3 JSON configs
        run: |
          python -m json.tool weather/config/observation_sources_v3.json >/dev/null
          python -m json.tool weather/config/v3_runtime.json >/dev/null
      - name: Run V3 observation and event safety tests
        run: python -m unittest weather.tests.test_observation_mesh_v3 weather.tests.test_v3_event_skill weather.tests.test_v3_shadow_cycle -v
