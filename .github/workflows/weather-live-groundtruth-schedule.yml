name: Weather Live Ground Truth Schedule

on:
  push:
    paths:
      - ".github/workflows/weather-live-groundtruth-schedule.yml"
  # 30-minute safety fallback. The 5-minute source watcher is authoritative.
  schedule:
    - cron: "4,34 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    uses: kenzuko/Jotrip-Lab/.github/workflows/weather-ground-truth.yml@feat/weather-lab-data-engine-v1
    with:
      target_ref: feat/weather-lab-data-engine-v1
    secrets: inherit

