name: Weather Live Himawari Schedule

on:
  push:
    paths:
      - ".github/workflows/weather-live-himawari-schedule.yml"
  # 30-minute safety fallback; external 10-minute dispatches probe first.
  schedule:
    - cron: "9,39 * * * *"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Force Himawari decoder recovery even without a new frame"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_heavy: ${{ steps.gate.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weather-lab-data-engine-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read last processed Himawari object
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data-weather --depth=1
          git show origin/data-weather:data/weather-nowcast/compact-latest.json > /tmp/nowcast.json 2>/dev/null || printf '{}\n' > /tmp/nowcast.json
      - name: Probe only Himawari object metadata
        id: gate
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m weather.collectors.source_watch \
            --only himawari \
            --previous-nowcast /tmp/nowcast.json \
            --output /tmp/cloud-probe.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          p=json.load(open('/tmp/cloud-probe.json'))
          force=str(os.getenv('FORCE_REFRESH','false')).lower()=='true'
          changed=bool(p.get('himawari_changed'))
          degraded=bool(p.get('errors'))
          print('run_heavy='+str(force or changed or degraded).lower())
          PY
      - name: Report gate
        run: cat /tmp/cloud-probe.json

  refresh:
    needs: inspect
    if: needs.inspect.outputs.run_heavy == 'true'
    uses: kenzuko/Jotrip-Lab/.github/workflows/weather-nowcast.yml@feat/weather-lab-data-engine-v1
    with:
      target_ref: feat/weather-lab-data-engine-v1
    secrets: inherit

# Manual recovery: workflow_dispatch(force_refresh=true).
