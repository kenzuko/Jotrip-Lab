name: Weather Live Himawari Schedule

on:
  push:
    paths:
      - ".github/workflows/weather-live-himawari-schedule.yml"
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

# shifted cadence away from exact tens to reduce GitHub schedule delay

permissions:
  contents: write

jobs:
  refresh:
    uses: kenzuko/Jotrip-Lab/.github/workflows/weather-nowcast.yml@feat/weather-lab-data-engine-v1
    with:
      target_ref: feat/weather-lab-data-engine-v1
    secrets: inherit
