name: Weather Lab tests

on:
  push:
    paths:
      - "weather/**"
      - "weather.html"
      - "weather-dashboard.js"
      - "weather-dashboard.css"
      - ".github/workflows/weather-lab-tests.yml"
  pull_request:
    paths:
      - "weather/**"
      - "weather.html"
      - "weather-dashboard.js"
      - "weather-dashboard.css"
  workflow_dispatch:
  workflow_call:
    inputs:
      scheduled_watch:
        description: "Run as the 30-minute lightweight cycle watcher"
        required: false
        type: boolean
        default: false
      target_ref:
        description: "Branch containing Weather Lab code and dashboard snapshot"
        required: false
        type: string
        default: "feat/weather-lab-data-engine-v1"
    secrets:
      COPERNICUSMARINE_SERVICE_USERNAME:
        required: false
      COPERNICUSMARINE_SERVICE_PASSWORD:
        required: false

concurrency:
  group: weather-lab-${{ inputs.scheduled_watch && 'scheduler' || 'ci' }}-${{ inputs.target_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cycle-watch:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_heavy: ${{ steps.gate.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight ECMWF client
        run: python -m pip install --quiet ecmwf-opendata
      - name: Check short and medium model cycles without GRIB downloads
        run: python -m weather.collectors.cycle_watch --snapshot weather/dashboard-data.json --output /tmp/cycle-watch.json
      - name: Decide whether heavy ingest is needed
        id: gate
        shell: bash
        run: |
          if [[ "${{ inputs.scheduled_watch }}" == "true" ]]; then
            RUN_HEAVY=$(python -c 'import json; p=json.load(open("/tmp/cycle-watch.json")); print(str(bool(p["run_heavy"])).lower())')
          else
            RUN_HEAVY=true
          fi
          echo "run_heavy=${RUN_HEAVY}" >> "$GITHUB_OUTPUT"
          echo "Weather Lab heavy ingest: ${RUN_HEAVY}"
          cat /tmp/cycle-watch.json
      - uses: actions/upload-artifact@v4
        with:
          name: weather-cycle-watch
          path: /tmp/cycle-watch.json
          retention-days: 7

  test:
    if: github.event_name != 'workflow_call' || !inputs.scheduled_watch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s weather/tests -v
      - run: python -m weather.pipeline.decision_features --input weather/tests/fixtures/end_to_end_decision.json --output /tmp/decision-features.json
      - run: python -c 'import json; p=json.load(open("/tmp/decision-features.json")); assert p["decision"]["decision"] == "GO_WITH_WATCH"; assert p["operational_probability"]["p_operational_window"] == .75'

  ecmwf-d10-point:
    needs: cycle-watch
    if: github.event_name != 'pull_request' && ((github.event_name != 'workflow_call' || !inputs.scheduled_watch) || needs.cycle-watch.outputs.run_heavy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official ECMWF client and GRIB decoder
        run: python -m pip install --quiet ecmwf-opendata eccodes
      - name: Collect freshest D0-D3 and medium-range D4-D10 fields
        run: python -m weather.collectors.ecmwf_72h --output /tmp/ecmwf-d10.json
      - name: Enforce D10 point readiness
        run: |
          python - <<'PY'
          import json
          from weather.points import POINTS
          p=json.load(open('/tmp/ecmwf-d10.json'))
          assert p['readiness'] == 'POINT_ROUTE_EXTRACTED', p
          assert p['horizon_hours'] == 240, p
          assert {0,24,48,72}.issubset(set(p['steps'])), p['steps']
          assert {144,180,216,240}.issubset(set(p['medium_steps'])), p['medium_steps']
          assert p.get('medium_run_time'), p
          assert p.get('short_record_count', 0) >= 200, p
          assert p.get('medium_record_count', 0) >= 500, p
          assert p.get('record_count', 0) >= 700, p
          spatial=p.get('spatial') or {}
          assert spatial.get('status') == 'READY', spatial
          assert spatial.get('cell_count',0) >= 20, spatial
          assert spatial.get('display_interpolation') == 'RENDER_ONLY', spatial
          assert len(spatial.get('frames') or []) >= 45, len(spatial.get('frames') or [])
          assert spatial['frames'][-1]['valid_time'] >= spatial['frames'][0]['valid_time']
          assert any(cell.get('u10_ms') is not None and cell.get('v10_ms') is not None
                     for frame in spatial['frames'] for cell in frame['cells']), spatial
          points={r.get('point_id') for r in p.get('records', [])} | {r.get('point_id') for r in p.get('medium_records', [])}
          assert set(POINTS).issubset(points), points
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ecmwf-live-d10-points
          path: /tmp/ecmwf-d10.json
          retention-days: 7

  noaa-member-smoke:
    needs: cycle-watch
    if: github.event_name != 'pull_request' && ((github.event_name != 'workflow_call' || !inputs.scheduled_watch) || needs.cycle-watch.outputs.run_heavy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GRIB decoder
        run: python -m pip install --quiet eccodes
      - name: Collect GEFS atmosphere and wave member gate
        run: python -m weather.collectors.noaa_member_smoke --lead 3 --output /tmp/noaa-members.json
      - name: Enforce member gate
        run: python -c 'import json; p=json.load(open("/tmp/noaa-members.json")); assert p["atmosphere"]["readiness"] == "MEMBER_COMPLETE", p["atmosphere"]; assert p["wave"]["readiness"] == "MEMBER_COMPLETE", p["wave"]'
      - uses: actions/upload-artifact@v4
        with:
          name: noaa-live-member-smoke
          path: /tmp/noaa-members.json
          retention-days: 7

  icon-point-smoke:
    needs: cycle-watch
    if: github.event_name != 'pull_request' && ((github.event_name != 'workflow_call' || !inputs.scheduled_watch) || needs.cycle-watch.outputs.run_heavy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CDO and GRIB decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cdo
          python -m pip install --quiet eccodes
      - name: Remap live ICON field and extract Phu Quoc
        run: python -m weather.collectors.icon_point --output /tmp/icon-point.json
      - name: Enforce point readiness
        run: python -c 'import json; p=json.load(open("/tmp/icon-point.json")); assert p["status"] == "POINT_NUMERIC_READY"; assert "phu_quoc_point" in p["decoded"]'
      - uses: actions/upload-artifact@v4
        with:
          name: icon-live-point-smoke
          path: /tmp/icon-point.json
          retention-days: 7

  copernicus-live-subset:
    needs: cycle-watch
    if: github.event_name != 'pull_request' && ((github.event_name != 'workflow_call' || !inputs.scheduled_watch) || needs.cycle-watch.outputs.run_heavy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official Toolbox and NetCDF reader
        run: python -m pip install --quiet copernicusmarine xarray netCDF4 numpy
      - name: Download Phu Quoc and Rach Gia wave and current subsets
        run: python -m weather.collectors.copernicus_live --output /tmp/copernicus-live.json
      - name: Enforce credential, variable and point gates
        run: |
          python - <<'PY'
          import json
          from weather.points import POINTS
          p=json.load(open("/tmp/copernicus-live.json"))
          assert p["status"] == "POINT_NUMERIC_READY", p
          assert p["wave"]["available_variables"] == ["VHM0","VMDR","VTM10","VTPK"]
          assert p["current"]["available_variables"] == ["uo","vo"]
          assert set(p["current"]["derived_vectors"]) == set(POINTS), p["current"]["derived_vectors"].keys()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copernicus-live-phu-quoc-subset
          path: /tmp/copernicus-live.json
          retention-days: 7

  publish-dashboard:
    if: github.event_name != 'pull_request'
    needs:
      - ecmwf-d10-point
      - noaa-member-smoke
      - icon-point-smoke
      - copernicus-live-subset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download ECMWF D10 artifact
        uses: actions/download-artifact@v4
        with:
          name: ecmwf-live-d10-points
          path: /tmp/weather-artifacts/ecmwf
      - name: Download GEFS artifact
        uses: actions/download-artifact@v4
        with:
          name: noaa-live-member-smoke
          path: /tmp/weather-artifacts/gefs
      - name: Download ICON artifact
        uses: actions/download-artifact@v4
        with:
          name: icon-live-point-smoke
          path: /tmp/weather-artifacts/icon
      - name: Download Copernicus artifact
        uses: actions/download-artifact@v4
        with:
          name: copernicus-live-phu-quoc-subset
          path: /tmp/weather-artifacts/copernicus
      - name: Build live D0-D10 dashboard snapshot
        run: |
          python -m weather.pipeline.build_dashboard \
            --ecmwf /tmp/weather-artifacts/ecmwf/ecmwf-d10.json \
            --gefs /tmp/weather-artifacts/gefs/noaa-members.json \
            --icon /tmp/weather-artifacts/icon/icon-point.json \
            --copernicus /tmp/weather-artifacts/copernicus/copernicus-live.json \
            --output weather/dashboard-data.json
      - name: Publish compact ECMWF spatial field for V5
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source=json.load(open('/tmp/weather-artifacts/ecmwf/ecmwf-d10.json'))
          spatial=source.get('spatial') or {}
          assert spatial.get('status') == 'READY', spatial
          payload={
              'schema_version':'weather-spatial-v1',
              'product':'JOTRIP_ECMWF_SPATIAL',
              'generated_at':source.get('checked_at'),
              'run_time':source.get('run_time'),
              'medium_run_time':source.get('medium_run_time'),
              'horizon_hours':source.get('horizon_hours'),
              'source':'ECMWF_OPEN_DATA_DIRECT',
              'spatial':spatial,
          }
          target=Path('weather/spatial-ecmwf.json')
          target.write_text(json.dumps(payload,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          assert target.stat().st_size < 2500000, target.stat().st_size
          PY
      - name: Enforce dashboard publication gate
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from weather.points import POINTS
          p=json.load(open('weather/dashboard-data.json', encoding='utf-8'))
          assert p['report_status'] == 'LIVE', p
          assert p['completeness'] >= 60, p
          assert p.get('forecast_horizon_hours') == 240, p
          assert set(p.get('points', {})) == set(POINTS), p.get('points', {}).keys()
          assert all(len(v['hours']) >= 45 for v in p['points'].values()), {k:len(v['hours']) for k,v in p['points'].items()}
          assert all(len(v.get('daily_outlook', [])) >= 2 for v in p['points'].values()), p
          assert set(p.get('source_cycles', {})) == {'ECMWF','ECMWF_MEDIUM','GEFS','ICON'}, p.get('source_cycles')
          generated=datetime.fromisoformat(p['generated_at'])
          age=(datetime.now(timezone.utc)-generated.astimezone(timezone.utc)).total_seconds()
          assert 0 <= age < 900, age
          PY
      - name: Commit dashboard snapshot
        shell: bash
        run: |
          git config user.name "jotrip-weather-bot"
          git config user.email "jotrip-weather-bot@users.noreply.github.com"
          git add weather/dashboard-data.json weather/spatial-ecmwf.json
          if git diff --cached --quiet; then
            echo "Dashboard snapshot unchanged"
            exit 0
          fi
          git commit -m "chore(weather): publish live D10 dashboard snapshot [skip ci]"
          git pull --rebase origin "${{ inputs.target_ref || github.ref_name }}"
          git push origin "HEAD:${{ inputs.target_ref || github.ref_name }}"
      - name: Build canonical LAB_SNAPSHOT_V1 after dashboard publish
        run: |
          python -m weather.pipeline.publish_snapshot \
            --dashboard weather/dashboard-data.json \
            --ecmwf /tmp/weather-artifacts/ecmwf/ecmwf-d10.json \
            --gefs /tmp/weather-artifacts/gefs/noaa-members.json \
            --icon /tmp/weather-artifacts/icon/icon-point.json \
            --copernicus /tmp/weather-artifacts/copernicus/copernicus-live.json \
            --root weather/snapshots
      - name: Enforce canonical snapshot preflight
        run: |
          python - <<'PY'
          import json
          from weather.pipeline.publish_snapshot import validate_snapshot
          from weather.processing.snapshot import verify_snapshot
          from weather.points import POINTS
          p=json.load(open('weather/snapshots/latest.json', encoding='utf-8'))
          assert verify_snapshot(p), 'payload hash mismatch'
          validate_snapshot(p)
          assert p['schema_version'] == '1.0'
          assert p['data_mode'] in {'A','B','C'}
          assert set(POINTS).issubset(p['points'])
          assert p['ensemble']['p_operational_window']['status'] == 'NOT_COMPUTABLE'
          PY
      - name: Commit canonical LAB snapshot
        shell: bash
        run: |
          git config user.name "jotrip-weather-bot"
          git config user.email "jotrip-weather-bot@users.noreply.github.com"
          git add weather/snapshots
          if git diff --cached --quiet; then
            echo "Canonical snapshot unchanged"
            exit 0
          fi
          git commit -m "chore(weather): publish canonical LAB snapshot [skip ci]"
          git pull --rebase origin "${{ inputs.target_ref || github.ref_name }}"
          git push origin "HEAD:${{ inputs.target_ref || github.ref_name }}"
