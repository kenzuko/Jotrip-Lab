name: Weather Lab tests

on:
  push:
    paths:
      - "weather/**"
      - ".github/workflows/weather-lab-tests.yml"
  pull_request:
    paths:
      - "weather/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      scheduled_watch:
        description: "Run as the 30-minute lightweight cycle watcher"
        required: false
        type: boolean
        default: false
      target_ref:
        description: "Branch containing Weather Lab code and dashboard snapshot"
        required: false
        type: string
        default: "feat/weather-lab-data-engine-v1"
    secrets:
      COPERNICUSMARINE_SERVICE_USERNAME:
        required: false
      COPERNICUSMARINE_SERVICE_PASSWORD:
        required: false

concurrency:
  group: weather-lab-${{ inputs.target_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cycle-watch:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      run_heavy: ${{ steps.gate.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight ECMWF client
        run: python -m pip install --quiet ecmwf-opendata
      - name: Check latest model cycles without GRIB downloads
        run: python -m weather.collectors.cycle_watch --snapshot weather/dashboard-data.json --output /tmp/cycle-watch.json
      - name: Decide whether heavy ingest is needed
        id: gate
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" || "${{ inputs.scheduled_watch }}" == "true" ]]; then
            RUN_HEAVY=$(python -c 'import json; p=json.load(open("/tmp/cycle-watch.json")); print(str(bool(p["run_heavy"])).lower())')
          else
            RUN_HEAVY=true
          fi
          echo "run_heavy=${RUN_HEAVY}" >> "$GITHUB_OUTPUT"
          echo "Weather Lab heavy ingest: ${RUN_HEAVY}"
          cat /tmp/cycle-watch.json
      - uses: actions/upload-artifact@v4
        with:
          name: weather-cycle-watch
          path: /tmp/cycle-watch.json
          retention-days: 7

  test:
    if: github.event_name != 'schedule' && !inputs.scheduled_watch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s weather/tests -v
      - run: python -m weather.pipeline.decision_features --input weather/tests/fixtures/end_to_end_decision.json --output /tmp/decision-features.json
      - run: python -c 'import json; p=json.load(open("/tmp/decision-features.json")); assert p["decision"]["decision"] == "GO_WITH_WATCH"; assert p["operational_probability"]["p_operational_window"] == .75'
      - run: python -m weather.pipeline.build_snapshot --input weather/tests/fixtures/an_thoi_2026_09_14.json --output /tmp/an_thoi_snapshot.json --cutoff 2026-09-14T22:45:00Z --offline
      - run: python -c 'import json; from weather.processing.snapshot import verify_snapshot; p=json.load(open("/tmp/an_thoi_snapshot.json")); assert verify_snapshot(p)'

  live-source-probe:
    needs: cycle-watch
    if: github.event_name != 'pull_request' && ((github.event_name != 'schedule' && !inputs.scheduled_watch) || needs.cycle-watch.outputs.run_heavy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe primary and official mirrors
        run: python -m weather.collectors.probe --output /tmp/source-health.json
      - name: Require every credential-free source to be reachable
        run: python -c 'import json; p=json.load(open("/tmp/source-health.json")); required=("ECMWF_DIRECT","NOAA_GEFS_DIRECT","NOAA_GEFS_WAVE_DIRECT","DWD_ICON_DIRECT"); assert all(p[k]["status"] == "REACHABLE" for k in required), p'
      - uses: actions/upload-artifact@v4
        with:
          name: weather-live-source-health
          path: /tmp/source-health.json
          retention-days: 7

  live-numeric-smoke:
    needs: cycle-watch
    if: github.event_name != 'pull_request' && ((github.event_name != 'schedule' && !inputs.scheduled_watch) || needs.cycle-watch.outputs.run_heavy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official model clients and GRIB decoder
        run: python -m pip install --disable-pip-version-check ecmwf-opendata eccodes
      - name: Download and decode live numerical fields
        run: python -m weather.collectors.live_smoke --output /tmp/numeric-smoke.json
      - name: Enforce numerical readiness gates
        run: python -c 'import json; p=json.load(open("/tmp/numeric-smoke.json")); assert p["ECMWF_DIRECT"]["status"] == "NUMERIC_READY", p["ECMWF_DIRECT"]; assert p["NOAA_GEFS_DIRECT"]["status"] == "NUMERIC_READY", p["NOAA_GEFS_DIRECT"]; assert p["NOAA_GEFS_WAVE_DIRECT"]["status"] == "NUMERIC_READY", p["NOAA_GEFS_WAVE_DIRECT"]; assert p["DWD_ICON_DIRECT"]["status"] == "FIELD_NUMERIC_READY_POINT_PENDING", p["DWD_ICON_DIRECT"]'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-live-numeric-smoke
          path: /tmp/numeric-smoke.json
          retention-days: 7

  icon-remap-asset:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect official DWD remapping pack
        run: python -m weather.collectors.icon_assets --output /tmp/icon-remap.json
      - name: Verify remapping assets exist
        run: python -c 'import json; p=json.load(open("/tmp/icon-remap.json")); assert p["status"] == "OFFICIAL_REMAP_PACK_READY"; assert p["bytes"] > 1000000; assert p["members"], p'
      - uses: actions/upload-artifact@v4
        with:
          name: icon-official-remap-pack-index
          path: /tmp/icon-remap.json
          retention-days: 7

  icon-point-smoke:
    needs: cycle-watch
    if: github.event_name != 'pull_request' && ((github.event_name != 'schedule' && !inputs.scheduled_watch) || needs.cycle-watch.outputs.run_heavy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CDO and GRIB decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cdo
          python -m pip install --quiet eccodes
      - name: Remap live ICON field and extract Phu Quoc
        run: python -m weather.collectors.icon_point --output /tmp/icon-point.json
      - name: Enforce point readiness
        run: python -c 'import json; p=json.load(open("/tmp/icon-point.json")); assert p["status"] == "POINT_NUMERIC_READY"; assert "phu_quoc_point" in p["decoded"]'
      - uses: actions/upload-artifact@v4
        with:
          name: icon-live-point-smoke
          path: /tmp/icon-point.json
          retention-days: 7

  ecmwf-72h-point-smoke:
    needs: cycle-watch
    if: github.event_name != 'pull_request' && ((github.event_name != 'schedule' && !inputs.scheduled_watch) || needs.cycle-watch.outputs.run_heavy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official client and GRIB decoder
        run: python -m pip install --quiet ecmwf-opendata eccodes
      - name: Collect D0-D3 fields at locked points including direct gust
        run: python -m weather.collectors.ecmwf_72h --output /tmp/ecmwf-72h.json
      - name: Enforce 72-hour point readiness
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ecmwf-72h.json'))
          assert p['readiness'] == 'POINT_ROUTE_EXTRACTED', p
          assert p['horizon_hours'] == 72
          assert {0,24,48,72}.issubset(set(p['steps']))
          assert p['record_count'] >= 200, p
          gusts=[r for r in p['records'] if r.get('variable') in {'10fg','10fg3','i10fg','max_i10fg'}]
          if p.get('gust_parameter'):
              assert len(gusts) >= 60, len(gusts)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ecmwf-live-72h-points
          path: /tmp/ecmwf-72h.json
          retention-days: 7

  noaa-member-smoke:
    needs: cycle-watch
    if: github.event_name != 'pull_request' && ((github.event_name != 'schedule' && !inputs.scheduled_watch) || needs.cycle-watch.outputs.run_heavy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GRIB decoder
        run: python -m pip install --quiet eccodes
      - name: Collect GEFS and GEFS Wave members
        run: python -m weather.collectors.noaa_member_smoke --lead 3 --output /tmp/noaa-members.json
      - name: Enforce member gate
        run: python -c 'import json; p=json.load(open("/tmp/noaa-members.json")); assert p["atmosphere"]["readiness"] == "MEMBER_COMPLETE", p["atmosphere"]; assert p["wave"]["readiness"] == "MEMBER_COMPLETE", p["wave"]'
      - uses: actions/upload-artifact@v4
        with:
          name: noaa-live-member-smoke
          path: /tmp/noaa-members.json
          retention-days: 7

  copernicus-live-subset:
    needs: cycle-watch
    if: github.event_name != 'pull_request' && ((github.event_name != 'schedule' && !inputs.scheduled_watch) || needs.cycle-watch.outputs.run_heavy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official Toolbox and NetCDF reader
        run: python -m pip install --quiet copernicusmarine xarray netCDF4 numpy
      - name: Download Phu Quoc wave and current subsets
        run: python -m weather.collectors.copernicus_live --output /tmp/copernicus-live.json
      - name: Enforce credential, variable and point gates
        run: python -c 'import json; p=json.load(open("/tmp/copernicus-live.json")); assert p["status"] == "POINT_NUMERIC_READY", p; assert p["wave"]["available_variables"] == ["VHM0","VMDR","VTM10","VTPK"]; assert p["current"]["available_variables"] == ["uo","vo"]; assert set(p["current"]["derived_vectors"]) == {"duong_dong","an_thoi","ganh_dau"}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copernicus-live-phu-quoc-subset
          path: /tmp/copernicus-live.json
          retention-days: 7

  publish-dashboard:
    if: github.event_name != 'pull_request'
    needs:
      - ecmwf-72h-point-smoke
      - noaa-member-smoke
      - icon-point-smoke
      - copernicus-live-subset
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download ECMWF artifact
        uses: actions/download-artifact@v4
        with:
          name: ecmwf-live-72h-points
          path: /tmp/weather-artifacts/ecmwf
      - name: Download GEFS artifact
        uses: actions/download-artifact@v4
        with:
          name: noaa-live-member-smoke
          path: /tmp/weather-artifacts/gefs
      - name: Download ICON artifact
        uses: actions/download-artifact@v4
        with:
          name: icon-live-point-smoke
          path: /tmp/weather-artifacts/icon
      - name: Download Copernicus artifact
        uses: actions/download-artifact@v4
        with:
          name: copernicus-live-phu-quoc-subset
          path: /tmp/weather-artifacts/copernicus
      - name: Build live dashboard snapshot
        run: |
          python -m weather.pipeline.build_dashboard \
            --ecmwf /tmp/weather-artifacts/ecmwf/ecmwf-72h.json \
            --gefs /tmp/weather-artifacts/gefs/noaa-members.json \
            --icon /tmp/weather-artifacts/icon/icon-point.json \
            --copernicus /tmp/weather-artifacts/copernicus/copernicus-live.json \
            --output weather/dashboard-data.json
      - name: Enforce dashboard publication gate
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          p=json.load(open('weather/dashboard-data.json', encoding='utf-8'))
          assert p['report_status'] == 'LIVE', p
          assert p['completeness'] >= 60, p
          assert all(len(v['hours']) >= 20 for v in p['points'].values()), p
          assert set(p.get('source_cycles', {})) == {'ECMWF','GEFS','ICON'}, p.get('source_cycles')
          generated=datetime.fromisoformat(p['generated_at'])
          age=(datetime.now(timezone.utc)-generated.astimezone(timezone.utc)).total_seconds()
          assert 0 <= age < 900, age
          PY
      - name: Commit dashboard snapshot
        shell: bash
        run: |
          TARGET_REF="${{ inputs.target_ref || github.ref_name }}"
          git config user.name "jotrip-weather-bot"
          git config user.email "jotrip-weather-bot@users.noreply.github.com"
          git add weather/dashboard-data.json
          if git diff --cached --quiet; then
            echo "Dashboard snapshot unchanged"
            exit 0
          fi
          git commit -m "chore(weather): publish live dashboard snapshot [skip ci]"
          git pull --rebase origin "${TARGET_REF}"
          git push origin "HEAD:${TARGET_REF}"
