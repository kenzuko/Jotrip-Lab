name: Sun Airport flights

on:
  workflow_dispatch:
  schedule:
    # D0 morning capture window: keep polling until the board rolls over.
    # UTC 21:00-23:45 = Vietnam 04:00-06:45.
    - cron: '*/15 21-23 * * *'
    # UTC 00:00-01:45 = Vietnam 07:00-08:45.
    - cron: '*/15 0-1 * * *'
    # Evening refresh window for the 18:00 report.
    # UTC 09:00-11:45 = Vietnam 16:00-18:45.
    - cron: '*/15 9-11 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sunairport-flights.yml'
      - 'tools/sunairport-collector/**'

permissions:
  contents: write

concurrency:
  group: sunairport-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # A re-run otherwise checks out the original event SHA and can
          # conflict with data committed by the preceding successful attempt.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install collector
        working-directory: tools/sunairport-collector
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Test normalization and QA
        working-directory: tools/sunairport-collector
        run: npm test

      - name: Collect official flight board
        id: collect
        working-directory: tools/sunairport-collector
        run: npm run collect

      - name: Save snapshot
        if: always()
        run: |
          set -o pipefail
          mkdir -p .artifacts/sunairport
          if git diff --quiet -- data/sunairport && [ -z "$(git status --porcelain data/sunairport)" ]; then
            echo "No data changes"
            exit 0
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'data/sunairport/health.json';
          if (fs.existsSync(file)) {
            const health = JSON.parse(fs.readFileSync(file, 'utf8'));
            health.commit_succeeded = true;
            fs.writeFileSync(file, `${JSON.stringify(health, null, 2)}\n`);
          }
          NODE

          git config user.name "jotrip-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sunairport
          git commit -m "data: update Sun Airport flight board"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3" | tee -a .artifacts/sunairport/commit.log
            git fetch origin main 2>&1 | tee -a .artifacts/sunairport/commit.log
            # This commit contains generated Sun Airport data only. During a
            # rebase, prefer the newly collected version of mutable pointers
            # such as latest.json and health.json, while retaining all other
            # commits already present on main.
            if ! git rebase -X theirs origin/main 2>&1 | tee -a .artifacts/sunairport/commit.log; then
              git status --short | tee -a .artifacts/sunairport/commit.log
              git rebase --abort || true
              break
            fi
            if git push origin HEAD:main 2>&1 | tee -a .artifacts/sunairport/commit.log; then
              exit 0
            fi
            sleep $((attempt * 5))
          done

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = 'data/sunairport/health.json';
          const target = '.artifacts/sunairport/health.json';
          if (fs.existsSync(source)) {
            const health = JSON.parse(fs.readFileSync(source, 'utf8'));
            health.state = 'COMMIT_FAILED';
            health.commit_succeeded = false;
            health.final_evidence_status = 'NOT_READY';
            fs.writeFileSync(target, `${JSON.stringify(health, null, 2)}\n`);
          }
          NODE
          exit 1

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sunairport-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/sunairport/
          if-no-files-found: warn
          retention-days: 14
