name: Sun Airport flights

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *' # 06:00 Vietnam
    - cron: '0 11 * * *' # 18:00 Vietnam
  push:
    branches: [main]
    paths:
      - '.github/workflows/sunairport-flights.yml'
      - 'tools/sunairport-collector/**'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install collector
        working-directory: tools/sunairport-collector
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Collect official flight board
        working-directory: tools/sunairport-collector
        run: npm run collect

      - name: Save snapshot
        run: |
          if git diff --quiet -- data/sunairport && [ -z "$(git status --porcelain data/sunairport)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "jotrip-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sunairport
          git commit -m "data: update Sun Airport flight board"
          git push
