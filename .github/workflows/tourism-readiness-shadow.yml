name: Tourism Data Readiness

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tourism_intelligence_v2/readiness.py'
      - 'tourism_intelligence_v2/readiness_bundle.py'
      - 'tourism_intelligence_v2/registry.py'
      - 'config/tourism_v2/source-registry.v1.json'
      - 'config/tourism_v2/module-registry.v1.json'
      - '.github/workflows/tourism-readiness-shadow.yml'
  schedule:
    # Asia/Ho_Chi_Minh 04:00-09:30
    - cron: '*/30 21-23 * * *'
    - cron: '*/30 0-2 * * *'
    # Asia/Ho_Chi_Minh 16:00-19:30
    - cron: '*/30 9-12 * * *'

concurrency:
  group: tourism-data-readiness-writer
  cancel-in-progress: true

permissions:
  contents: write

env:
  DATA_BRANCH: data-tourism-readiness

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fetch isolated input refs
        run: |
          git fetch origin data-sunairport:data-sunairport --depth=1
          git fetch origin data-marine-ops:data-marine-ops --depth=1
          git fetch origin data-airfare-fallback:data-airfare-fallback --depth=1
          git fetch origin data-forward-airlift:data-forward-airlift --depth=1
          git fetch origin feat/weather-lab-data-engine-v1:feat/weather-lab-data-engine-v1 --depth=1

      - name: Materialize read-only inputs
        run: |
          mkdir -p /tmp/tourism-readiness
          git show data-sunairport:data/sunairport/health.json > /tmp/tourism-readiness/sun-health.json
          git show data-marine-ops:data/marine_ops/health.json > /tmp/tourism-readiness/marine-health.json
          git show data-airfare-fallback:data/airfare_fallback/health.json > /tmp/tourism-readiness/airfare-health.json
          git show data-forward-airlift:data/forward_airlift/health.json > /tmp/tourism-readiness/forward-airlift-health.json
          git show feat/weather-lab-data-engine-v1:weather/snapshots/latest.json > /tmp/tourism-readiness/weather-latest.json

      - name: Build versioned readiness bundle
        run: |
          python -m tourism_intelligence_v2.readiness_bundle \
            --weather /tmp/tourism-readiness/weather-latest.json \
            --sun /tmp/tourism-readiness/sun-health.json \
            --marine /tmp/tourism-readiness/marine-health.json \
            --airfare-fallback /tmp/tourism-readiness/airfare-health.json \
            --forward-airlift /tmp/tourism-readiness/forward-airlift-health.json \
            --output-dir /tmp/tourism-readiness/bundle

      - name: Enforce no overclaim
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/tourism-readiness/bundle/latest.json', encoding='utf-8'))
          h=json.load(open('/tmp/tourism-readiness/bundle/health.json', encoding='utf-8'))
          assert p['market_condition_not_data_system_condition'] is True
          assert p['modules']['hotel_forward']['state'] == 'RESEARCH_ON_DEMAND'
          assert p['modules']['airfare']['state'] == 'FALLBACK_READY'
          assert p['modules']['airfare']['fixed_basket_ready'] is False
          assert p['modules']['airfare']['airfare_pressure_eligible'] is False
          assert 'airfare' in p['missing_core_modules']
          assert p['modules']['forward_airlift']['state'] in {'PARTIAL_READY','REPORT_READY'}
          if not p['modules']['forward_airlift']['forward_airlift_signal_eligible']:
              assert p['modules']['forward_airlift']['state'] != 'REPORT_READY'
          assert p['pipeline_health_score'] is None
          assert p['run_status'] in {'DEGRADED','PARTIAL','FULL'}
          assert h['state'] == 'REPORT_READY'
          print(json.dumps({
              'run_status':p['run_status'],
              'completeness':p['overall_completeness_percent'],
              'freshness':p['source_freshness_score'],
              'missing':p['missing_core_modules'],
              'airfare':p['modules']['airfare'],
              'forward_airlift':p['modules']['forward_airlift'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tourism-readiness-${{ github.run_id }}
          path: /tmp/tourism-readiness/**
          if-no-files-found: error
          retention-days: 14

      - name: Persist readiness to isolated data branch
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='/tmp/tourism-readiness/bundle/health.json'
          h=json.load(open(p, encoding='utf-8'))
          h['commit_succeeded']=True
          with open(p,'w',encoding='utf-8') as f:
              json.dump(h,f,ensure_ascii=False,indent=2,sort_keys=True)
              f.write('\n')
          PY

          DAY=$(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d)
          STAMP=$(TZ=Asia/Ho_Chi_Minh date +%H%M)
          rm -rf /tmp/tourism-readiness-export
          mkdir -p /tmp/tourism-readiness-export
          cp -a /tmp/tourism-readiness/bundle/. /tmp/tourism-readiness-export/

          git fetch origin "$DATA_BRANCH" --depth=1
          git checkout -B "$DATA_BRANCH" "origin/$DATA_BRANCH"
          mkdir -p data/tourism_readiness/$DAY
          cp -a /tmp/tourism-readiness-export/. data/tourism_readiness/
          cp /tmp/tourism-readiness-export/latest.json data/tourism_readiness/$DAY/$STAMP.json
          git config user.name 'jotrip-readiness-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/tourism_readiness

          if git diff --cached --quiet; then
            echo 'No readiness changes'
            exit 0
          fi

          git commit -m 'data: update Tourism Data Readiness'
          for attempt in 1 2 3; do
            if git pull --rebase origin "$DATA_BRANCH" && git push origin "HEAD:$DATA_BRANCH"; then
              echo "Readiness persisted on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo 'Failed to persist readiness after 3 attempts'
          exit 1
