name: Weather Source Change Watch

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/weather-source-watch-schedule.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: weather-source-change-watch
  cancel-in-progress: true

env:
  WEATHER_REF: feat/weather-lab-data-engine-v1
  DATA_REF: data-weather

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      groundtruth_changed: ${{ steps.change.outputs.groundtruth_changed }}
      himawari_changed: ${{ steps.change.outputs.himawari_changed }}
      vvpq_changed: ${{ steps.change.outputs.vvpq_changed }}
      vrain_changed: ${{ steps.change.outputs.vrain_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WEATHER_REF }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read current canonical source identities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${DATA_REF}" --depth=1
          git show "origin/${DATA_REF}:data/weather-groundtruth/latest.json" > /tmp/previous-groundtruth.json 2>/dev/null || printf '{}\n' > /tmp/previous-groundtruth.json
          git show "origin/${DATA_REF}:data/weather-nowcast/compact-latest.json" > /tmp/previous-nowcast.json 2>/dev/null || printf '{}\n' > /tmp/previous-nowcast.json

      - name: Probe source metadata and compact JSON only
        id: change
        shell: bash
        run: |
          set -euo pipefail
          python -m weather.collectors.source_watch \
            --previous-groundtruth /tmp/previous-groundtruth.json \
            --previous-nowcast /tmp/previous-nowcast.json \
            --output /tmp/source-watch.json

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('/tmp/source-watch.json'))
          for key in ('groundtruth_changed','himawari_changed','vvpq_changed','vrain_changed'):
              print(f"{key}={'true' if p.get(key) else 'false'}")
          PY

      - name: Report source decision
        run: cat /tmp/source-watch.json

      - name: Dispatch changed source processors without waiting
        env:
          GH_TOKEN: ${{ github.token }}
          GT_CHANGED: ${{ steps.change.outputs.groundtruth_changed }}
          CLOUD_CHANGED: ${{ steps.change.outputs.himawari_changed }}
        shell: bash
        run: |
          set -euo pipefail

          active_runs() {
            local workflow="$1"
            gh run list --repo "${GITHUB_REPOSITORY}" --workflow "$workflow" --limit 10 \
              --json status --jq '[.[] | select(.status != "completed")] | length'
          }

          maybe_dispatch() {
            local changed="$1"
            local workflow="$2"
            local label="$3"
            if [[ "$changed" != "true" ]]; then
              echo "$label source unchanged"
              return 0
            fi
            local active
            active="$(active_runs "$workflow")"
            if [[ "${active:-0}" -gt 0 ]]; then
              echo "$label processor already active; leaving the source change for the next watcher"
              return 0
            fi
            gh workflow run "$workflow" --repo "${GITHUB_REPOSITORY}" --ref main
            echo "Dispatched $label processor"
          }

          maybe_dispatch "$GT_CHANGED" "weather-live-groundtruth-schedule.yml" "Ground Truth"
          maybe_dispatch "$CLOUD_CHANGED" "weather-live-himawari-schedule.yml" "Himawari"

      - uses: actions/upload-artifact@v4
        with:
          name: weather-source-watch
          path: /tmp/source-watch.json
          retention-days: 3
