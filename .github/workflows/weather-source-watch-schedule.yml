name: Weather Source Change Watch

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/weather-source-watch-schedule.yml"

permissions:
  contents: write

concurrency:
  group: weather-source-change-watch
  cancel-in-progress: true

env:
  WEATHER_REF: feat/weather-lab-data-engine-v1
  DATA_REF: data-weather

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      groundtruth_changed: ${{ steps.change.outputs.groundtruth_changed }}
      himawari_changed: ${{ steps.change.outputs.himawari_changed }}
      vvpq_changed: ${{ steps.change.outputs.vvpq_changed }}
      vrain_changed: ${{ steps.change.outputs.vrain_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WEATHER_REF }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read current canonical source identities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${DATA_REF}" --depth=1
          git show "origin/${DATA_REF}:data/weather-groundtruth/latest.json" > /tmp/previous-groundtruth.json 2>/dev/null || printf '{}\n' > /tmp/previous-groundtruth.json
          git show "origin/${DATA_REF}:data/weather-nowcast/compact-latest.json" > /tmp/previous-nowcast.json 2>/dev/null || printf '{}\n' > /tmp/previous-nowcast.json

      - name: Probe source metadata and compact JSON only
        id: change
        shell: bash
        run: |
          set -euo pipefail
          python -m weather.collectors.source_watch \
            --previous-groundtruth /tmp/previous-groundtruth.json \
            --previous-nowcast /tmp/previous-nowcast.json \
            --output /tmp/source-watch.json

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('/tmp/source-watch.json'))
          for key in ('groundtruth_changed','himawari_changed','vvpq_changed','vrain_changed'):
              print(f"{key}={'true' if p.get(key) else 'false'}")
          PY

      - name: Report source decision
        run: cat /tmp/source-watch.json

      - uses: actions/upload-artifact@v4
        with:
          name: weather-source-watch
          path: /tmp/source-watch.json
          retention-days: 3

  refresh-groundtruth:
    needs: inspect
    if: needs.inspect.outputs.groundtruth_changed == 'true'
    uses: kenzuko/Jotrip-Lab/.github/workflows/weather-ground-truth.yml@feat/weather-lab-data-engine-v1
    with:
      target_ref: feat/weather-lab-data-engine-v1
    secrets: inherit

  refresh-nowcast:
    needs: inspect
    if: needs.inspect.outputs.himawari_changed == 'true'
    uses: kenzuko/Jotrip-Lab/.github/workflows/weather-nowcast.yml@feat/weather-lab-data-engine-v1
    with:
      target_ref: feat/weather-lab-data-engine-v1
    secrets: inherit

  recompose-local-now:
    needs: [inspect, refresh-groundtruth, refresh-nowcast]
    if: >-
      always() &&
      (needs.inspect.outputs.groundtruth_changed == 'true' || needs.inspect.outputs.himawari_changed == 'true') &&
      (needs.refresh-groundtruth.result == 'success' || needs.refresh-groundtruth.result == 'skipped') &&
      (needs.refresh-nowcast.result == 'success' || needs.refresh-nowcast.result == 'skipped')
    uses: kenzuko/Jotrip-Lab/.github/workflows/weather-local-now-fast.yml@feat/weather-lab-data-engine-v1
    with:
      target_ref: feat/weather-lab-data-engine-v1
    secrets: inherit

  publish:
    needs: recompose-local-now
    if: needs.recompose-local-now.result == 'success'
    uses: kenzuko/Jotrip-Lab/.github/workflows/github-pages-weather.yml@main
    secrets: inherit
