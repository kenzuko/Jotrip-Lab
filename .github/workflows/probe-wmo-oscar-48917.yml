name: Probe WMO OSCAR 48917 identity

on:
  push:
    branches:
      - fix/synop-48917-identity-quarantine-20261001
    paths:
      - ".github/workflows/probe-wmo-oscar-48917.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch official WMO OSCAR station metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, hashlib, xml.etree.ElementTree as ET, json
          urls=[
            "https://oscar.wmo.int/surface/rest/api/wmd/download/0-20000-0-48917",
            "https://oscar.wmo.int/surface/rest/api/stations/0-20000-0-48917",
          ]
          for url in urls:
              print("=== URL",url)
              req=urllib.request.Request(url,headers={"User-Agent":"JoTrip-Weather-station-identity-audit/1.0","Accept":"application/xml,text/xml,application/json,*/*"})
              try:
                  with urllib.request.urlopen(req,timeout=35) as r:
                      body=r.read()
                      print("STATUS",r.status)
                      print("CONTENT_TYPE",r.headers.get("Content-Type"))
                      print("FINAL_URL",r.geturl())
                      print("BYTES",len(body))
                      text=body.decode("utf-8","replace")
                      print("SHA256",hashlib.sha256(body).hexdigest())
                      print("CONTAINS_VVPQ", "VVPQ" in text)
                      print("CONTAINS_CURRENT_AIRPORT_COORDS", ("10.169" in text or "103.993" in text))
                      if len(body)>100:
                          open("/tmp/oscar-48917-response","wb").write(body)
                          try:
                              root=ET.fromstring(body)
                              ns={
                                "gml":"http://www.opengis.net/gml/3.2",
                                "wmdr":"http://def.wmo.int/wmdr/2017",
                                "gco":"http://www.isotc211.org/2005/gco",
                                "gmd":"http://www.isotc211.org/2005/gmd",
                              }
                              def texts(xpath):
                                  return [x.text.strip() for x in root.findall(xpath,ns) if x.text and x.text.strip()]
                              summary={
                                "wigos_identifiers":texts(".//gml:identifier"),
                                "names":texts(".//gml:name"),
                                "positions":sorted(set(texts(".//gml:pos"))),
                                "date_established":texts(".//wmdr:dateEstablished"),
                                "facility_types":[x.attrib.get("{http://www.w3.org/1999/xlink}href") for x in root.findall(".//wmdr:facilityType",ns)],
                                "owners":texts(".//gmd:organisationName/gco:CharacterString"),
                                "begin_positions":sorted(set(texts(".//gml:beginPosition"))),
                                "end_positions":sorted(set(texts(".//gml:endPosition"))),
                                "reporting_status_hrefs":sorted(set(x.attrib.get("{http://www.w3.org/1999/xlink}href") for x in root.findall(".//wmdr:reportingStatus/wmdr:ReportingStatus/wmdr:reportingStatus",ns))),
                                "program_hrefs":sorted(set(x.attrib.get("{http://www.w3.org/1999/xlink}href") for x in root.findall(".//wmdr:programAffiliation/wmdr:ProgramAffiliation/wmdr:programAffiliation",ns))),
                                "reporting_intervals":sorted(set(texts(".//wmdr:temporalReportingInterval"))),
                              }
                              print("PARSED_SUMMARY",json.dumps(summary,ensure_ascii=False))
                          except Exception as pe:
                              print("PARSE_ERROR",repr(pe))
                          break
              except Exception as e:
                  print("ERROR",repr(e))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oscar-48917-official-metadata
          path: /tmp/oscar-48917-response
          if-no-files-found: ignore
          retention-days: 3
