name: Deploy Airport Live to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'airport-live/**'
      - '.github/workflows/airport-live-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: airport-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Airport Live artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./airport-live

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
