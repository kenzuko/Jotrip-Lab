name: Weather Ground Truth Extract

on:
  push:
    branches:
      - research/ground-truth-probe-20260917
    paths:
      - 'weather/research/extract_probe_result.mjs'
      - '.github/workflows/ground-truth-extract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ground-truth-probe-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract compact endpoint findings from saved trace
        run: node weather/research/extract_probe_result.mjs
      - name: Persist findings
        shell: bash
        run: |
          git config user.name 'jotrip-weather-bot'
          git config user.email 'jotrip-weather-bot@users.noreply.github.com'
          git add weather/research/ground-truth-probe/extracted.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(weather): extract ground-truth endpoints [skip ci]'
          git push origin HEAD:research/ground-truth-probe-20260917
