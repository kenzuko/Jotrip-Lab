name: Weather GEFS Local Matrix

on:
  push:
    paths:
      - "weather/collectors/gefs_local_matrix.py"
      - "weather/processing/ensemble_local.py"
      - "weather/tests/test_gefs_local_matrix.py"
      - ".github/workflows/weather-gefs-local-matrix.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      target_ref:
        required: false
        type: string
        default: "feat/weather-lab-data-engine-v1"
      smoke:
        required: false
        type: boolean
        default: false

concurrency:
  group: weather-gefs-local-${{ inputs.target_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ensemble:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet eccodes
      - name: Unit contract
        run: |
          python -m unittest weather.tests.test_ensemble_local -v
          python -m unittest weather.tests.test_gefs_local_matrix -v
      - name: Restore latest ACTUAL-trained calibration
        shell: bash
        run: |
          git fetch origin data-weather --depth=1
          git show origin/data-weather:data/weather-calibration/latest.json > /tmp/weather-calibration.json 2>/dev/null || printf '{}\n' > /tmp/weather-calibration.json
      - name: Collect local GEFS member matrix
        shell: bash
        run: |
          if [[ "${{ inputs.smoke }}" == "true" || ( "${{ github.event_name }}" == "push" && "${{ github.ref_name }}" != "main" ) ]]; then
            python -m weather.collectors.gefs_local_matrix --members 3 --lead 6 --lead 12 --workers 2 --calibration /tmp/weather-calibration.json --output /tmp/gefs-local.json
          else
            python -m weather.collectors.gefs_local_matrix --members 31 --workers 4 --calibration /tmp/weather-calibration.json --output /tmp/gefs-local.json
          fi
      - name: Validate ensemble semantics
        shell: bash
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/gefs-local.json'))
          assert p['readiness'] in {'MEMBER_MATRIX_READY','PARTIAL_ENSEMBLE'}, p
          assert p['source']=='NOAA_NOMADS_GEFS_GRIB_FILTER'
          assert p['calibration_engine']=='PQ_ENSEMBLE_LOCAL_V1'
          assert p['calibration_status'] in {'LEARNING','PARTIAL','READY'}, p['calibration_status']
          assert {'vvpq','vrain_cua_can','vrain_bai_thom','vrain_an_thoi'}.issubset(set(p.get('verification_points') or {}))
          assert {'duong_dong','an_thoi','ganh_dau','cua_can','bai_thom','ham_ninh','bai_sao'}.issubset(set(p['points']))
          assert p.get('wind_exposure_engine')=='PQ_LOCAL_WIND_EXPOSURE_V1'
          assert 'bai_sao' in set(p.get('wind_exposure_points') or [])
          spatial=p.get('spatial') or {}
          assert spatial.get('status')=='READY', spatial
          assert spatial.get('native_resolution_deg')==0.5, spatial
          assert spatial.get('display_interpolation')=='RENDER_ONLY', spatial
          assert spatial.get('cell_count',0) >= 16, spatial
          assert len(spatial.get('frames') or []) >= 1, spatial
          assert all('u10_q50_ms' in cell['wind'] and 'v10_q50_ms' in cell['wind']
                     for frame in spatial['frames'] for cell in frame['cells']), spatial
          for point_id, rows in p['points'].items():
              assert rows, p
              for row in rows:
                  assert {'temperature','wind','rain'}.issubset(row['variables'])
                  for variable, v in row['variables'].items():
                      assert v['status'] in {'LEARNING','CALIBRATED'}
                      if v['status']=='LEARNING' and (variable != 'wind' or point_id != 'bai_sao'):
                          assert v['raw']['q50']==v['corrected']['q50']
                  wind=row['variables']['wind']
                  if point_id=='bai_sao':
                      assert wind.get('local_exposure',{}).get('status')=='HEURISTIC_V1'
                      assert wind['corrected']['q50'] <= wind['raw']['q50']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gefs-local-ensemble
          path: /tmp/gefs-local.json
          retention-days: 7
      - name: Persist production matrix
        if: ${{ github.ref_name == 'main' && inputs.smoke != true }}
        shell: bash
        run: |
          rm -rf /tmp/gefs-export
          mkdir -p /tmp/gefs-export
          cp /tmp/gefs-local.json /tmp/gefs-export/latest.json
          mkdir -p /tmp/gefs-export/archive
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open('/tmp/gefs-local.json'))
          spatial=p.get('spatial') or {}
          spatial_payload={
            'schema_version':'weather-spatial-v1',
            'product':'JOTRIP_GEFS_SPATIAL_ENSEMBLE',
            'generated_at':p.get('generated_at'),
            'run_time':p.get('run_time'),
            'horizon_hours':p.get('horizon_hours'),
            'completion_ratio':p.get('completion_ratio'),
            'calibration_status':p.get('calibration_status'),
            'source':p.get('source'),
            'spatial':spatial,
          }
          Path('/tmp/gefs-export/spatial.json').write_text(
            json.dumps(spatial_payload,ensure_ascii=False,separators=(',',':'))+'\n',
            encoding='utf-8'
          )
          archive={
            'schema_version':'1.0',
            'product':'JOTRIP_VERIFICATION_FORECAST_ARCHIVE',
            'run_time':p.get('run_time'),
            'generated_at':p.get('generated_at'),
            'source':p.get('source'),
            'model':p.get('model'),
            'completion_ratio':p.get('completion_ratio'),
            'verification_points':p.get('verification_points') or {},
          }
          run=str(p.get('run_time') or '').replace(':','').replace('-','')
          stamp=run.replace('+0000','Z').replace('+00:00','Z')
          if not stamp:
            stamp=str(p.get('generated_at') or 'unknown').replace(':','').replace('-','')
          Path('/tmp/gefs-export/archive/latest.json').write_text(
            json.dumps(archive,ensure_ascii=False,separators=(',',':'))+'\n',
            encoding='utf-8'
          )
          Path('/tmp/gefs-export/health.json').write_text(json.dumps({
            'module':'JoTrip GEFS Local Ensemble',
            'state':p['status'],
            'run_time':p['run_time'],
            'generated_at':p['generated_at'],
            'completion_ratio':p['completion_ratio'],
            'horizon_hours':p['horizon_hours'],
            'calibration_status':p['calibration_status'],
            'spatial_status':spatial.get('status'),
            'spatial_cells':spatial.get('cell_count'),
            'spatial_frames':len(spatial.get('frames') or []),
          },ensure_ascii=False,indent=2)+'\n')
          assert Path('/tmp/gefs-export/spatial.json').stat().st_size < 1500000
          PY

          git reset --hard HEAD
          git fetch origin data-weather
          git checkout -B data-weather origin/data-weather
          mkdir -p data/weather-ensemble data/weather-forecast-archive
          cp /tmp/gefs-export/latest.json data/weather-ensemble/latest.json
          cp /tmp/gefs-export/spatial.json data/weather-ensemble/spatial.json
          cp /tmp/gefs-export/health.json data/weather-ensemble/health.json

          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          src=Path('/tmp/gefs-export/archive/latest.json')
          p=json.loads(src.read_text(encoding='utf-8'))
          t=datetime.fromisoformat(str(p['run_time']).replace('Z','+00:00'))
          root=Path('data/weather-forecast-archive')
          day=root/t.strftime('%Y')/t.strftime('%m')/t.strftime('%d')
          day.mkdir(parents=True,exist_ok=True)
          target=day/(t.strftime('%Y%m%dT%H%M%SZ')+'.json')
          target.write_text(src.read_text(encoding='utf-8'),encoding='utf-8')
          (root/'latest.json').write_text(src.read_text(encoding='utf-8'),encoding='utf-8')
          PY
          git config user.name "jotrip-weather-bot"
          git config user.email "jotrip-weather-bot@users.noreply.github.com"
          git add data/weather-ensemble data/weather-forecast-archive
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: update Phu Quoc GEFS local ensemble"
          for attempt in 1 2 3; do
            if git pull --rebase origin data-weather && git push origin HEAD:data-weather; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
