name: Tourism Forward Airlift

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tourism_intelligence_v2/collectors/forward_airlift/**'
      - 'config/tourism_v2/forward-airlift-sources.v1.json'
      - '.github/workflows/tourism-forward-airlift.yml'
  schedule:
    # 05:10 and 17:10 Asia/Ho_Chi_Minh.
    - cron: '10 22 * * *'
    - cron: '10 10 * * *'

concurrency:
  group: tourism-forward-airlift-data-writer
  cancel-in-progress: false

permissions:
  contents: write

env:
  DATA_BRANCH: data-forward-airlift

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout production code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install free parser dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Collect forward airlift evidence
        run: python -m tourism_intelligence_v2.collectors.forward_airlift.collector --output /tmp/forward_airlift

      - name: Enforce supply-only and score gates
        id: gate
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/forward_airlift/latest.json', encoding='utf-8'))
          h=json.load(open('/tmp/forward_airlift/health.json', encoding='utf-8'))
          assert all(x.get('passenger_demand_inference_allowed') is False for x in p['evidence'])
          if not p['score_gate_passed']:
              assert p['forward_airlift_signal'] is None
          print(json.dumps({'state':h['state'],'market_coverage':h['market_coverage'],'direct_market_coverage':h['direct_market_coverage'],'score_gate_passed':h['score_gate_passed']},ensure_ascii=False,indent=2))
          with open('/tmp/forward_state.txt','w',encoding='utf-8') as f:
              f.write(h['state'])
          PY
          echo "state=$(cat /tmp/forward_state.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-airlift-${{ github.run_id }}
          path: /tmp/forward_airlift/**
          if-no-files-found: error
          retention-days: 14

      - name: Persist to isolated data branch
        if: always()
        shell: bash
        run: |
          test -d /tmp/forward_airlift
          python - <<'PY'
          import json
          p='/tmp/forward_airlift/health.json'
          h=json.load(open(p, encoding='utf-8'))
          h['commit_succeeded']=True
          with open(p,'w',encoding='utf-8') as f:
              json.dump(h,f,ensure_ascii=False,indent=2,sort_keys=True)
              f.write('\n')
          PY
          DAY=$(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d)
          STAMP=$(TZ=Asia/Ho_Chi_Minh date +%H%M)
          rm -rf /tmp/forward-export
          mkdir -p /tmp/forward-export
          cp -a /tmp/forward_airlift/. /tmp/forward-export/
          git fetch origin "$DATA_BRANCH" --depth=1
          git checkout -B "$DATA_BRANCH" "origin/$DATA_BRANCH"
          mkdir -p data/forward_airlift/$DAY
          cp -a /tmp/forward-export/. data/forward_airlift/
          cp /tmp/forward-export/latest.json data/forward_airlift/$DAY/$STAMP.json
          git config user.name 'jotrip-forward-airlift-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/forward_airlift
          if git diff --cached --quiet; then
            echo 'No forward airlift changes'
            exit 0
          fi
          git commit -m 'data: update forward airlift evidence'
          for attempt in 1 2 3; do
            if git pull --rebase origin "$DATA_BRANCH" && git push origin "HEAD:$DATA_BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo 'Failed to persist forward airlift after 3 attempts'
          exit 1

      - name: Fail only when no forward evidence exists
        if: steps.gate.outputs.state == 'DEGRADED'
        run: exit 1
