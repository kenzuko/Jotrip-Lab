name: Weather Environment 3h scheduler

on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/weather-environment-scheduler.yml"

concurrency:
  group: weather-environment-clock
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  air-quality:
    uses: kenzuko/Jotrip-Lab/.github/workflows/weather-air-quality.yml@feat/weather-lab-data-engine-v1
    with:
      target_ref: feat/weather-lab-data-engine-v1
    secrets: inherit

  tide:
    uses: kenzuko/Jotrip-Lab/.github/workflows/weather-tide.yml@feat/weather-lab-data-engine-v1
    with:
      target_ref: feat/weather-lab-data-engine-v1
    secrets: inherit
