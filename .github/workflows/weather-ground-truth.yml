name: Weather Ground Truth + PQ Local Now

on:
  push:
    paths:
      - "weather/collectors/phuquoc_ground_truth.py"
      - "weather/processing/local_now.py"
      - "weather/processing/calibration_pipeline.py"
      - "weather/processing/source_skill.py"
      - "weather/pipeline/archive_public_snapshot.py"
      - "weather/tests/test_ground_truth_local_now.py"
      - "weather/tests/test_calibration_pipeline.py"
      - "weather/tests/test_source_skill.py"
      - ".github/workflows/weather-ground-truth.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      target_ref:
        description: "Branch containing Weather Lab code"
        required: false
        type: string
        default: "feat/weather-lab-data-engine-v1"

concurrency:
  group: weather-ground-truth-${{ inputs.target_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DATA_BRANCH: data-weather
  DATA_ROOT: data/weather-groundtruth
  NOWCAST_ROOT: data/weather-nowcast
  FORECAST_ARCHIVE_ROOT: data/weather-forecast-archive
  CALIBRATION_ROOT: data/weather-calibration
  ANALYTICS_ROOT: data/weather-analytics
  ENSEMBLE_ROOT: data/weather-ensemble
  CURRENT_ROOT: data/weather-current
  SOURCE_SKILL_ROOT: data/weather-source-skill
  PUBLISHED_ROOT: data/weather-published

jobs:
  ground-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore previous observation state
        shell: bash
        run: |
          git fetch origin "$DATA_BRANCH" --depth=1
          for path in "$DATA_ROOT" "$NOWCAST_ROOT" "$FORECAST_ARCHIVE_ROOT" "$CALIBRATION_ROOT" "$ANALYTICS_ROOT" "$ENSEMBLE_ROOT" "$CURRENT_ROOT" "$SOURCE_SKILL_ROOT" "$PUBLISHED_ROOT"; do
            git checkout "origin/$DATA_BRANCH" -- "$path" 2>/dev/null || true
          done

      - name: Test ground truth, local analysis and calibration formulas
        run: |
          python -m unittest weather.tests.test_ground_truth_local_now -v
          python -m unittest weather.tests.test_calibration_pipeline -v
          python -m unittest weather.tests.test_source_skill -v

      - name: Collect public in-situ observations
        shell: bash
        run: |
          PREVIOUS=""
          if [ -f "$DATA_ROOT/latest.json" ]; then
            PREVIOUS="--previous $DATA_ROOT/latest.json"
          fi
          python -m weather.collectors.phuquoc_ground_truth --output /tmp/groundtruth.json $PREVIOUS

      - name: Restore provisional source-skill weights
        shell: bash
        run: |
          if [ -f "$SOURCE_SKILL_ROOT/latest.json" ]; then
            cp "$SOURCE_SKILL_ROOT/latest.json" /tmp/source-skill-prior.json
          else
            printf '{}\n' > /tmp/source-skill-prior.json
          fi

      - name: Build PQ Local Now
        shell: bash
        run: |
          NOWCAST="$NOWCAST_ROOT/latest.json"
          if [ ! -f "$NOWCAST" ]; then
            NOWCAST="weather/nowcast.json"
          fi
          ENSEMBLE="$ENSEMBLE_ROOT/latest.json"
          EXTRA_ENSEMBLE=""
          if [ -f "$ENSEMBLE" ]; then
            EXTRA_ENSEMBLE="--ensemble $ENSEMBLE"
          fi
          python -m weather.processing.local_now             --groundtruth /tmp/groundtruth.json             --dashboard weather/dashboard-data.json             --nowcast "$NOWCAST"             $EXTRA_ENSEMBLE             --source-skill /tmp/source-skill-prior.json             --output /tmp/local-now.json

      - name: Validate semantic safety gates
        run: |
          python - <<'PY'
          import json
          gt=json.load(open('/tmp/groundtruth.json'))
          ln=json.load(open('/tmp/local-now.json'))
          assert gt['status'] in {'READY','UNAVAILABLE'}
          if gt['status']=='READY':
              if gt.get('atmosphere',{}).get('vvpq',{}).get('status') in {'FRESH','STALE'}:
                  assert gt['atmosphere']['vvpq']['data_class']=='ACTUAL'
              for s in gt['rainfall'].get('stations',{}).values():
                  assert s['data_class']=='ACTUAL'
                  assert s['statistic']=='ACCUMULATION'
          assert ln['engine']=='PQ_LOCAL_NOW_V2'
          assert ln['data_class']=='ESTIMATED_NOW'
          for p in ln['points'].values():
              assert p['marine']['data_class']=='MODEL_ONLY'
              assert p['temperature']['data_class'] in {'ESTIMATED_NOW','MODEL_ONLY'}
              assert p['wind']['data_class'] in {'ESTIMATED_NOW','MODEL_ONLY'}
              assert p['rain']['data_class']=='ESTIMATED_NOW'
          PY

      - name: Build compact current bundle
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          VN=timezone(timedelta(hours=7))
          gt=json.load(open('/tmp/groundtruth.json'))
          ln=json.load(open('/tmp/local-now.json'))
          compact=Path('data/weather-nowcast/compact-latest.json')
          nowcast={}
          if compact.exists():
              try: nowcast=json.loads(compact.read_text(encoding='utf-8'))
              except Exception: nowcast={}

          def parse_time(v):
              try:
                  return datetime.fromisoformat(str(v).replace('Z','+00:00'))
              except Exception:
                  return None

          local_now_time=parse_time(ln.get('generated_at')) or datetime.now(timezone.utc)
          today=local_now_time.astimezone(VN).date()
          root=Path('data/weather-groundtruth')

          # Keep the public bundle small: one latest Estimated Now sample per
          # 30-minute local bucket, enough for a smooth intraday chart.
          by_point={}
          snapshots=[]
          for p in (root/'analysis').rglob('*.json'):
              try:
                  payload=json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue
              t=parse_time(payload.get('generated_at'))
              if t and t.astimezone(VN).date()==today:
                  snapshots.append(payload)
          snapshots.append(ln)

          buckets={}
          for payload in snapshots:
              t=parse_time(payload.get('generated_at'))
              if not t:
                  continue
              lt=t.astimezone(VN)
              bucket=lt.replace(minute=(lt.minute//30)*30,second=0,microsecond=0)
              for point_id,p in (payload.get('points') or {}).items():
                  key=(point_id,bucket.isoformat())
                  row={
                      'time':t.isoformat(),
                      'temperature_c':p.get('temperature_c'),
                      'wind_kmh':p.get('wind_kmh'),
                      'rain_rate_mm_h':(p.get('rain') or {}).get('rain_rate_mm_h'),
                      'wave_hs_m':p.get('wave_hs_m'),
                      'convective_score':(p.get('rain') or {}).get('convective_score'),
                      'data_class':'ESTIMATED_NOW',
                  }
                  previous=buckets.get(key)
                  if previous is None or str(row['time'])>str(previous['time']):
                      buckets[key]=row
          for (point_id,_),row in sorted(buckets.items(),key=lambda item:(item[0][0],item[0][1])):
              by_point.setdefault(point_id,[]).append(row)

          # VVPQ is retained separately as an ACTUAL anchor. Front-end only
          # overlays it where spatially appropriate; it is never relabelled as
          # the selected point's observation.
          vvpq_buckets={}
          actual_payloads=[]
          for p in root.glob('20*/*/*/*.json'):
              try:
                  payload=json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue
              v=(payload.get('atmosphere') or {}).get('vvpq') or {}
              t=parse_time(v.get('observed_at'))
              if t and t.astimezone(VN).date()==today and v.get('data_class')=='ACTUAL' and v.get('qc')=='PASS':
                  actual_payloads.append(v)
          current_v=(gt.get('atmosphere') or {}).get('vvpq') or {}
          if current_v:
              actual_payloads.append(current_v)
          for v in actual_payloads:
              t=parse_time(v.get('observed_at'))
              if not t:
                  continue
              lt=t.astimezone(VN)
              key=lt.replace(minute=(lt.minute//30)*30,second=0,microsecond=0).isoformat()
              vvpq_buckets[key]={
                  'time':t.isoformat(),
                  'wind_kmh':v.get('wind_speed_kmh'),
                  'temperature_c':v.get('temperature_c'),
                  'data_class':'ACTUAL',
                  'source':'VVPQ',
              }

          bundle={
              'schema_version':'weather-current-v2',
              'generated_at':ln.get('generated_at') or gt.get('generated_at'),
              'groundtruth':gt,
              'local_now':ln,
              'nowcast':nowcast,
              'today_series':{
                  'date':today.isoformat(),
                  'cadence_minutes':30,
                  'points':by_point,
                  'actual':{'vvpq':list(vvpq_buckets.values())},
              },
          }
          Path('/tmp/weather-current.json').write_text(
              json.dumps(bundle,ensure_ascii=False,separators=(',',':'))+'\n',
              encoding='utf-8'
          )
          PY

      - name: Archive public Weather values for later backtest
        shell: bash
        run: |
          python -m weather.pipeline.archive_public_snapshot             --bundle /tmp/weather-current.json             --root "$PUBLISHED_ROOT"             --cadence-minutes 30

      - name: Build ACTUAL-only forecast verification and calibration
        shell: bash
        run: |
          python -m weather.processing.calibration_pipeline             --forecast-root "$FORECAST_ARCHIVE_ROOT"             --groundtruth-root "$DATA_ROOT"             --current-groundtruth /tmp/groundtruth.json             --output-calibration /tmp/weather-calibration.json             --output-analytics /tmp/weather-analytics.json

          python - <<'PY'
          import json
          cal=json.load(open('/tmp/weather-calibration.json'))
          ana=json.load(open('/tmp/weather-analytics.json'))
          assert cal['training_policy']['estimated_now_allowed'] is False
          assert ana['policy']['estimated_now_is_training_label'] is False
          assert cal['status'] in {'LEARNING','PARTIAL','READY'}
          PY

      - name: Build compact calibration archive
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          root=Path('data/weather-groundtruth')
          gt=json.load(open('/tmp/groundtruth.json'))
          ln=json.load(open('/tmp/local-now.json'))
          t=datetime.fromisoformat(gt['generated_at'].replace('Z','+00:00'))
          day=root/t.strftime('%Y')/t.strftime('%m')/t.strftime('%d')
          day.mkdir(parents=True,exist_ok=True)
          stamp=t.strftime('%H%M%S')
          (day/f'{stamp}.json').write_text(json.dumps(gt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          analysis=root/'analysis'/t.strftime('%Y')/t.strftime('%m')/t.strftime('%d')
          analysis.mkdir(parents=True,exist_ok=True)
          (analysis/f'{stamp}.json').write_text(json.dumps(ln,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          root.mkdir(parents=True,exist_ok=True)
          (root/'latest.json').write_text(json.dumps(gt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'local-now.json').write_text(json.dumps(ln,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          health={
              'module':'JoTrip Weather Ground Truth',
              'state':gt['status'],
              'generated_at':gt['generated_at'],
              'vvpq':gt.get('atmosphere',{}).get('vvpq',{}).get('status'),
              'vrain':gt.get('rainfall',{}).get('status'),
              'rain_stations':list(gt.get('rainfall',{}).get('stations',{})),
              'increment_ready':[k for k,v in gt.get('rainfall',{}).get('stations',{}).items() if v.get('increment_qc')=='PASS'],
              'local_engine':ln['engine'],
              'actual_policy':gt['actual_policy'],
          }
          (root/'health.json').write_text(json.dumps(health,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Persist isolated observation state
        shell: bash
        run: |
          rm -rf /tmp/weather-groundtruth-export /tmp/weather-published-export
          mkdir -p /tmp/weather-groundtruth-export /tmp/weather-published-export
          cp -a "$DATA_ROOT"/. /tmp/weather-groundtruth-export/
          if [ -d "$PUBLISHED_ROOT" ]; then cp -a "$PUBLISHED_ROOT"/. /tmp/weather-published-export/; fi
          cp /tmp/weather-calibration.json /tmp/weather-calibration-latest.json
          cp /tmp/weather-analytics.json /tmp/weather-analytics-latest.json
          cp /tmp/weather-current.json /tmp/weather-current-latest.json
          cp /tmp/weather-source-skill.json /tmp/weather-source-skill-latest.json

          git reset --hard HEAD
          rm -rf "$DATA_ROOT"
          git fetch origin "$DATA_BRANCH"
          git checkout -B "$DATA_BRANCH" "origin/$DATA_BRANCH"
          mkdir -p "$DATA_ROOT" "$CALIBRATION_ROOT" "$ANALYTICS_ROOT" "$CURRENT_ROOT" "$SOURCE_SKILL_ROOT" "$PUBLISHED_ROOT"
          cp -a /tmp/weather-groundtruth-export/. "$DATA_ROOT"/
          cp -a /tmp/weather-published-export/. "$PUBLISHED_ROOT"/ 2>/dev/null || true
          cp /tmp/weather-calibration-latest.json "$CALIBRATION_ROOT/latest.json"
          cp /tmp/weather-analytics-latest.json "$ANALYTICS_ROOT/latest.json"
          cp /tmp/weather-current-latest.json "$CURRENT_ROOT/latest.json"
          cp /tmp/weather-source-skill-latest.json "$SOURCE_SKILL_ROOT/latest.json"

          git config user.name "jotrip-weather-bot"
          git config user.email "jotrip-weather-bot@users.noreply.github.com"
          git add "$DATA_ROOT" "$CALIBRATION_ROOT" "$ANALYTICS_ROOT" "$CURRENT_ROOT" "$SOURCE_SKILL_ROOT" "$PUBLISHED_ROOT"
          if git diff --cached --quiet; then
            echo "Ground truth state unchanged"
            exit 0
          fi
          git commit -m "data: archive Phu Quoc ground truth and PQ Local Now"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$DATA_BRANCH" && git push origin "HEAD:$DATA_BRANCH"; then
              echo "Ground truth persisted on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phu-quoc-ground-truth
          path: |
            /tmp/groundtruth.json
            /tmp/local-now.json
            /tmp/weather-calibration.json
            /tmp/weather-analytics.json
            /tmp/weather-current.json
            /tmp/weather-source-skill.json
          retention-days: 7
