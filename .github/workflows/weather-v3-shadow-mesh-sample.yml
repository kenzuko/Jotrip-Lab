name: Weather V3 shadow mesh sample

on:
  push:
    branches:
      - "feat/weather-v3-observation-mesh-shadow-20261001"
    paths:
      - "weather/pipeline/build_observation_mesh_v3_shadow.py"
      - "weather/processing/observation_mesh_v3.py"
      - "weather/config/observation_sources_v3.json"
      - ".github/workflows/weather-v3-shadow-mesh-sample.yml"
  workflow_dispatch:

concurrency:
  group: weather-v3-shadow-mesh-sample
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weather-v3-observation-mesh-shadow-20261001
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read latest existing Weather observations
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data-weather --depth=1
          git show origin/data-weather:data/weather-groundtruth/latest.json > /tmp/groundtruth.json
          git show origin/data-weather:data/weather-nowcast/compact-latest.json > /tmp/nowcast.json
          python -m json.tool /tmp/groundtruth.json >/dev/null
          python -m json.tool /tmp/nowcast.json >/dev/null

      - name: Build V3 shadow Observation Mesh
        run: |
          python -m weather.pipeline.build_observation_mesh_v3_shadow             --groundtruth /tmp/groundtruth.json             --nowcast /tmp/nowcast.json             --output weather/research/v3-shadow-sample.json

      - name: Validate V2 remains authority
        run: |
          python - <<'PY'
          import json
          p=json.load(open('weather/research/v3-shadow-sample.json'))
          assert p['status']=='SHADOW_ONLY'
          assert p['production_authority']=='WEATHER_V2_UNCHANGED'
          assert p['receipt_count'] > 0
          assert p['counts_by_class'].get('GROUND_OBSERVED',0) > 0
          assert p['counts_by_class'].get('REMOTE_OBSERVED',0) > 0
          assert p['policy']['null_is_never_zero'] is True
          print('receipts:',p['receipt_count'])
          print('groups:',p['independent_group_count'])
          print('classes:',p['counts_by_class'])
          PY

      - name: Commit shadow sample only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jotrip-weather-v3-shadow"
          git config user.email "actions@users.noreply.github.com"
          git add weather/research/v3-shadow-sample.json
          if git diff --cached --quiet; then
            echo "Shadow sample unchanged"
            exit 0
          fi
          git commit -m "data: capture Weather V3 shadow mesh sample [skip ci]"
          git push origin HEAD:feat/weather-v3-observation-mesh-shadow-20261001
