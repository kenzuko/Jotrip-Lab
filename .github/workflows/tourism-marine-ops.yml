name: Tourism Marine Operations

on:
  workflow_dispatch:
  push:
    branches:
      - feat/tourism-intelligence-v2-safe-modules-v1
    paths:
      - 'tourism_intelligence_v2/collectors/marine_ops/**'
      - 'tourism_intelligence_v2/contracts.py'
      - 'tourism_intelligence_v2/storage.py'
      - 'config/tourism_v2/marine-ops.v1.json'
      - '.github/workflows/tourism-marine-ops.yml'
  schedule:
    # Runs only after this workflow reaches the default branch.
    # Asia/Ho_Chi_Minh morning 04:00-09:30.
    - cron: '*/30 21-23 * * *'
    - cron: '*/30 0-2 * * *'
    # Evening refresh 16:00-19:30.
    - cron: '*/30 9-12 * * *'

concurrency:
  group: tourism-marine-ops-data-writer
  cancel-in-progress: false

permissions:
  contents: write

env:
  DATA_BRANCH: data-marine-ops

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout collector code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install free parser dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Collect D0 marine operations evidence
        run: python -m tourism_intelligence_v2.collectors.marine_ops.collector --output /tmp/marine_ops

      - name: Inspect collector health
        id: health
        shell: bash
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/marine_ops/health.json', encoding='utf-8'))
          print(json.dumps(p, ensure_ascii=False, indent=2))
          with open('/tmp/marine_state.txt','w', encoding='utf-8') as f:
              f.write(p['state'])
          PY
          echo "state=$(cat /tmp/marine_state.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marine-ops-${{ github.run_id }}
          path: /tmp/marine_ops/**
          if-no-files-found: error
          retention-days: 14

      - name: Persist run to isolated data branch
        if: always()
        shell: bash
        run: |
          if [ ! -d /tmp/marine_ops ]; then
            echo 'No marine output to persist'
            exit 1
          fi

          python - <<'PY'
          import json
          p='/tmp/marine_ops/health.json'
          h=json.load(open(p, encoding='utf-8'))
          h['commit_succeeded']=True
          with open(p,'w',encoding='utf-8') as f:
              json.dump(h,f,ensure_ascii=False,indent=2,sort_keys=True)
              f.write('\n')
          PY

          git fetch origin "$DATA_BRANCH" --depth=1
          git checkout -B "$DATA_BRANCH" "origin/$DATA_BRANCH"
          mkdir -p data/marine_ops
          cp -a /tmp/marine_ops/. data/marine_ops/
          git config user.name 'jotrip-marine-ops-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/marine_ops

          if git diff --cached --quiet; then
            echo 'No Marine Operations data changes'
            exit 0
          fi

          git commit -m 'data: update Marine Operations evidence'
          for attempt in 1 2 3; do
            if git pull --rebase origin "$DATA_BRANCH" && git push origin "HEAD:$DATA_BRANCH"; then
              echo "Marine Operations persisted on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo 'Failed to persist Marine Operations state after 3 attempts'
          exit 1

      - name: Fail run only if collector had no usable source
        if: steps.health.outputs.state == 'FAILED'
        run: exit 1
