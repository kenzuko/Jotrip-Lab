name: Tourism Intelligence V2 safe-module tests

on:
  push:
    paths:
      - 'tourism_intelligence_v2/**'
      - 'config/tourism_v2/**'
      - '.github/workflows/tourism-v2-safe-tests.yml'
  pull_request:
    paths:
      - 'tourism_intelligence_v2/**'
      - 'config/tourism_v2/**'
      - '.github/workflows/tourism-v2-safe-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free/open-source parser dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Run additive-module tests
        run: python -m unittest discover -s tourism_intelligence_v2/tests -v
      - name: Guard protected legacy paths
        shell: bash
        run: |
          BASE_SHA="${{ github.event.before }}"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -E '^(weather/|weather-dashboard\.|tools/sunairport-collector/|\.github/workflows/weather-lab|\.github/workflows/sunairport-flights\.yml|index\.html$|app\.js$|style\.css$)'; then
            echo 'Protected legacy path changed by Tourism V2 safe module commit.'
            exit 1
          fi
