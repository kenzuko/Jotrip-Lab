name: Tourism Hotel Forward Shadow

on:
  workflow_dispatch:
  push:
    branches:
      - feat/tourism-v2-hotel-shadow-v1
    paths:
      - 'tourism_intelligence_v2/collectors/hotel_forward/**'
      - 'config/tourism_v2/hotel-basket.v1.json'
      - '.github/workflows/tourism-hotel-forward-shadow.yml'

permissions:
  contents: read

concurrency:
  group: tourism-hotel-forward-shadow
  cancel-in-progress: true

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free browser tooling
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Shadow scan D+30 on three hotels
        run: |
          python -m tourism_intelligence_v2.collectors.hotel_forward.collector \
            --horizon 30 \
            --hotel-limit 3 \
            --output /tmp/hotel_forward_shadow
      - name: Enforce shadow safety
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/hotel_forward_shadow/latest.json', encoding='utf-8'))
          h=json.load(open('/tmp/hotel_forward_shadow/health.json', encoding='utf-8'))
          assert p['mode'] == 'SHADOW'
          assert p['eligible_for_master'] is False
          assert h['eligible_for_master'] is False
          assert h['commit_succeeded'] is None
          print(json.dumps({'health':h,'coverage':p['coverage'],'states':[x['availability_state'] for x in p['observations']]}, ensure_ascii=False, indent=2))
          PY
      - name: Upload hotel shadow diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-forward-shadow-${{ github.run_id }}
          path: /tmp/hotel_forward_shadow/**
          if-no-files-found: error
          retention-days: 7
