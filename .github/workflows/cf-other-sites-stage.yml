name: Stage legacy web frontends on Cloudflare Pages (no DNS cutover)
on:
  push:
    branches: [ops/cf-pages-migration-20261009]
    paths: [.github/workflows/cf-other-sites-stage.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - repo: jotrip-dash
            project: openpq-dash-web
          - repo: phuquoccharter
            project: openpq-charter-web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      CF_PROJECT_NAME: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static release from exact source
        shell: bash
        env:
          REPO: ${{ matrix.repo }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch main "https://github.com/kenzuko/$REPO.git" source-site
          if [ "$REPO" = "phuquoccharter" ]; then
            python3 source-site/scripts/inject_copy_runtime.py source-site
          fi
          mkdir -p candidate
          while IFS= read -r -d '' file; do
            rel="${file#source-site/}"
            case "$rel" in
              .git/*|.github/*|tests/*|scripts/*|collector/*|supabase/*|cms-worker/*|node_modules/*|.env*|*/.env*) continue ;;
            esac
            case "$rel" in
              *.html|*.js|*.css|*.json|*.svg|*.png|*.jpg|*.jpeg|*.webp|*.avif|*.gif|*.ico|*.woff|*.woff2|*.ttf|*.webmanifest|*.txt|*.xml)
                mkdir -p "candidate/$(dirname "$rel")"
                cp "$file" "candidate/$rel"
                ;;
            esac
          done < <(find source-site -type f -print0)
          cat > candidate/_headers <<'HEADERS'
          /*
            X-Robots-Tag: noindex, nofollow, noarchive
          HEADERS
          test -s candidate/index.html
          test -s candidate/app.js
          node --check candidate/app.js
          echo "STAGING_REPO=$REPO SOURCE_SHA=$(git -C source-site rev-parse HEAD) FILES=$(find candidate -type f | wc -l)"
          test ! -e candidate/CNAME
          test ! -d candidate/.github
          test ! -d candidate/cms-worker
          test ! -d candidate/supabase
      - name: Check isolated Cloudflare Pages project
        id: existing
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const fs=await import('node:fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!account||!token)throw Error('Cloudflare credentials unavailable');
          const url='https://api.cloudflare.com/client/v4/accounts/'+account+'/pages/projects/'+process.env.CF_PROJECT_NAME;
          const response=await fetch(url,{headers:{Authorization:'Bearer '+token,Accept:'application/json'}});
          const data=await response.json();
          if(response.status!==404 && !(response.ok&&data.success))
            throw Error('Pages project inspect status='+response.status+' errors='+(data.errors||[]).map(e=>e.code).join(','));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'exists='+(response.status!==404)+String.fromCharCode(10));
          NODE
      - name: Create non-production Pages project
        if: steps.existing.outputs.exists == 'false'
        run: npx --yes wrangler@4 pages project create "$CF_PROJECT_NAME" --production-branch main
      - name: Stage exact frontend assets
        run: npx --yes wrangler@4 pages deploy candidate --project-name "$CF_PROJECT_NAME" --branch main
      - name: Verify preview HTTP
        shell: bash
        run: |
          set -euo pipefail
          origin="https://$CF_PROJECT_NAME.pages.dev"
          for path in / /app.js; do
            ready=0
            for n in $(seq 1 12); do
              code="$(curl -sS -L --max-time 15 -o /dev/null -w '%{http_code}' "$origin$path?probe=$n" || true)"
              if [ "$code" = 200 ]; then ready=1; break; fi
              sleep 3
            done
            echo "STAGE_PATH=$path HTTP=$code"
            test "$ready" = 1
          done
          echo "STAGING_OK=$origin"
