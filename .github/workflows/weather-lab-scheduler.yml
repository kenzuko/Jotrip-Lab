name: Weather Lab 30m scheduler

on:
  # Compatibility name retained because downstream workflow_run triggers depend on it.
  # Metadata cycle watch now runs every 15 minutes; heavy model ingest remains cycle-gated.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/weather-lab-scheduler.yml"

concurrency:
  group: weather-lab-clock
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  weather-lab:
    uses: kenzuko/Jotrip-Lab/.github/workflows/weather-lab-tests.yml@feat/weather-lab-data-engine-v1
    with:
      scheduled_watch: true
      target_ref: feat/weather-lab-data-engine-v1
    secrets: inherit

