name: Weather Ground Truth Public Probe

on:
  push:
    branches:
      - research/ground-truth-probe-20260917
    paths:
      - 'weather/research/probe_kttvtudong.mjs'
      - '.github/workflows/ground-truth-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-ground-truth-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ground-truth-probe-20260917
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Probe public KTTV pages with a real browser
        run: node weather/research/probe_kttvtudong.mjs

      - name: Persist sanitized probe result
        shell: bash
        run: |
          git config user.name 'jotrip-weather-bot'
          git config user.email 'jotrip-weather-bot@users.noreply.github.com'
          git add weather/research/ground-truth-probe/latest.json
          if git diff --cached --quiet; then
            echo 'No diagnostic changes'
            exit 0
          fi
          git commit -m 'research(weather): capture public ground-truth transport [skip ci]'
          git push origin HEAD:research/ground-truth-probe-20260917
