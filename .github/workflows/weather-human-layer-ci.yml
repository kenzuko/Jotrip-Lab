name: Human Weather Layer CI

on:
  push:
    branches: ["feat/weather-human-layer-v1-20260930"]
    paths:
      - ".github/workflows/weather-human-layer-ci.yml"
      - "weather/processing/human_weather.py"
      - "weather/pipeline/build_critical_payload.py"
      - "weather/tests/test_human_weather.py"
      - "weather/tests/test_critical_human_weather.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  human-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax
        run: python -m py_compile weather/processing/human_weather.py weather/pipeline/build_critical_payload.py
      - name: Human Weather unit and payload integration
        run: python -m unittest weather.tests.test_human_weather weather.tests.test_critical_human_weather -v
      - name: Full Weather Lab unit regression
        run: python -m unittest discover -s weather/tests -v
