name: CF parity report
on:
  push:
    branches: [ops/cf-pages-migration-20261009]
    paths: [.github/workflows/cf-migration-parity.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/cf-migration-parity.mjs
