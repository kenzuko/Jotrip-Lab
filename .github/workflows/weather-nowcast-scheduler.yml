name: Weather Nowcast 30m scheduler

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/weather-nowcast-scheduler.yml"

concurrency:
  group: weather-nowcast-clock
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  himawari-nowcast:
    uses: kenzuko/Jotrip-Lab/.github/workflows/weather-nowcast.yml@feat/weather-lab-data-engine-v1
    with:
      target_ref: feat/weather-lab-data-engine-v1
    secrets: inherit

