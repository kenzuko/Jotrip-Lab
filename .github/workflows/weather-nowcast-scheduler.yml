name: Weather Nowcast 30m scheduler

on:
  # Scheduled cadence moved to weather-live-himawari-schedule.yml (every 10m).
  # Keep this workflow for manual/path-triggered recovery only to avoid duplicate
  # reusable runs cancelling each other.
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/weather-nowcast-scheduler.yml"

concurrency:
  group: weather-nowcast-clock
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  himawari-nowcast:
    uses: kenzuko/Jotrip-Lab/.github/workflows/weather-nowcast.yml@feat/weather-lab-data-engine-v1
    with:
      target_ref: feat/weather-lab-data-engine-v1
    secrets: inherit

