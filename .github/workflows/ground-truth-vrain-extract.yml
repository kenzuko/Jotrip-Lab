name: Weather Ground Truth VRain Extract

on:
  push:
    branches:
      - research/ground-truth-probe-20260917
    paths:
      - 'weather/research/extract_vrain_public.mjs'
      - '.github/workflows/ground-truth-vrain-extract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ground-truth-probe-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node weather/research/extract_vrain_public.mjs
      - shell: bash
        run: |
          git config user.name 'jotrip-weather-bot'
          git config user.email 'jotrip-weather-bot@users.noreply.github.com'
          git add weather/research/ground-truth-probe/vrain-calls.json weather/research/ground-truth-probe/vrain-routes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(weather): extract VRain public routes [skip ci]'
          git push origin HEAD:research/ground-truth-probe-20260917
