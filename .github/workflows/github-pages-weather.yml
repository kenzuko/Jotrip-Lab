name: Weather Lab - GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-pages-weather.yml"
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-pages-writer
  cancel-in-progress: false

env:
  WEATHER_REF: feat/weather-lab-data-engine-v1
  DATA_REF: data-weather
  PAGES_REF: gh-pages
  PAGES_DIR: weather

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Weather Lab source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WEATHER_REF }}
          path: source
          fetch-depth: 1

      - name: Checkout compact live data
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_REF }}
          path: live-data
          fetch-depth: 1

      - name: Checkout existing GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PAGES_REF }}
          path: pages
          fetch-depth: 0

      - name: Build isolated Weather Lab sub-site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/weather-pages
          mkdir -p /tmp/weather-pages/data
          cp source/weather/tide.json /tmp/weather-pages/data/tide.json

          cp source/weather.html /tmp/weather-pages/index.html
          cp source/weather.html /tmp/weather-pages/weather.html
          cp source/weather.html /tmp/weather-pages/v2.html
          cp source/weather-v2.css /tmp/weather-pages/
          cp source/weather-v2.js /tmp/weather-pages/
          cp source/weather-v3.html /tmp/weather-pages/v3.html
          cp source/weather-v3.html /tmp/weather-pages/weather-v3.html
          cp source/weather-v3.css /tmp/weather-pages/
          cp source/weather-v3.js /tmp/weather-pages/
          cp source/weather-v4.html /tmp/weather-pages/v4.html
          cp source/weather-v4.html /tmp/weather-pages/weather-v4.html
          cp source/weather-v4.css /tmp/weather-pages/
          cp source/weather-v4.js /tmp/weather-pages/
          cp source/weather-v5.html /tmp/weather-pages/v5.html
          cp source/weather-v5.html /tmp/weather-pages/weather-v5.html
          cp source/weather-v5.css /tmp/weather-pages/
          cp source/weather-v5.js /tmp/weather-pages/
          if [ -f source/weather/spatial-ecmwf.json ]; then
            cp source/weather/spatial-ecmwf.json /tmp/weather-pages/
          fi
          if [ -f source/weather/spatial-marine.json ]; then
            cp source/weather/spatial-marine.json /tmp/weather-pages/
          fi
          if [ -f source/weather/spatial-icon.json ]; then
            cp source/weather/spatial-icon.json /tmp/weather-pages/
          fi
          cp source/weather-brand.svg /tmp/weather-pages/
          cp source/weather-history.html /tmp/weather-pages/
          cp source/weather-history.css /tmp/weather-pages/
          cp source/weather-history.js /tmp/weather-pages/
          cp source/weather-app-icon.svg /tmp/weather-pages/
          cp source/weather-manifest.webmanifest /tmp/weather-pages/
          cp source/weather-sw.js /tmp/weather-pages/

          if [ -d live-data/data/weather-aqi ]; then
            cp -a live-data/data/weather-aqi /tmp/weather-pages/data/
          fi
          if [ -d live-data/data/weather-nowcast ]; then
            cp -a live-data/data/weather-nowcast /tmp/weather-pages/data/
          fi
          if [ -d live-data/data/weather-groundtruth ]; then
            cp -a live-data/data/weather-groundtruth /tmp/weather-pages/data/
          fi
          if [ -d live-data/data/weather-ensemble ]; then
            cp -a live-data/data/weather-ensemble /tmp/weather-pages/data/
          fi

          PYTHONPATH=source python -m weather.pipeline.build_critical_payload \
            --dashboard source/weather/dashboard-data.json \
            --local-now live-data/data/weather-groundtruth/local-now.json \
            --groundtruth live-data/data/weather-groundtruth/latest.json \
            --aqi live-data/data/weather-aqi/latest.json \
            --tide source/weather/tide.json \
            --nowcast live-data/data/weather-nowcast/latest.json \
            --ensemble live-data/data/weather-ensemble/latest.json \
            --output /tmp/weather-pages/data/critical.json
          test $(wc -c < /tmp/weather-pages/data/critical.json) -lt 60000
          PYTHONPATH=source python -m weather.pipeline.build_jotrip_forecast \
            --ensemble live-data/data/weather-ensemble/latest.json \
            --nowcast live-data/data/weather-nowcast/compact-latest.json \
            --output /tmp/weather-pages/jotrip-forecast.json
          test $(wc -c < /tmp/weather-pages/jotrip-forecast.json) -lt 120000

      - name: Make Weather Lab safe under /Jotrip-Lab/weather/
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('/tmp/weather-pages')
          base = '/Jotrip-Lab/weather/'
          text_ext = {'.html', '.js', '.css', '.webmanifest'}

          replacements = {
              '/weather/critical.json': base + 'data/critical.json',
              '/weather/jotrip-forecast.json': base + 'jotrip-forecast.json',
              '/weather/spatial-ecmwf.json': base + 'spatial-ecmwf.json',
              '/weather/spatial-marine.json': base + 'spatial-marine.json',
              '/weather/spatial-icon.json': base + 'spatial-icon.json',
              '/weather-v2.css': base + 'weather-v2.css',
              '/weather-v2.js': base + 'weather-v2.js',
              '/weather-brand.svg': base + 'weather-brand.svg',
              '/weather/tide.json': base + 'data/tide.json',
              '/data/weather-aqi/': base + 'data/weather-aqi/',
              '/data/weather-nowcast/': base + 'data/weather-nowcast/',
              '/data/weather-groundtruth/': base + 'data/weather-groundtruth/',
              '/data/weather-ensemble/': base + 'data/weather-ensemble/',
              '/weather-history.html': base + 'weather-history.html',
              '/weather-history.css': base + 'weather-history.css',
              '/weather-history.js': base + 'weather-history.js',
              '/weather.html': base,
              '/weather-app-icon.svg': base + 'weather-app-icon.svg',
              '/weather-manifest.webmanifest': base + 'weather-manifest.webmanifest',
              '/weather-sw.js': base + 'weather-sw.js',
          }

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in text_ext:
                  continue
              text = path.read_text(encoding='utf-8')
              # Rewrite only same-origin string literals. Never rewrite a path
              # that merely appears inside an external https:// URL.
              for old, new in replacements.items():
                  for quote in ('"', "'", '`'):
                      text = text.replace(quote + old, quote + new)
              text = text.replace('{scope:"/"}', '{scope:"/Jotrip-Lab/weather/"}')
              text = text.replace("{scope:'/' }", "{scope:'/Jotrip-Lab/weather/'}")
              path.write_text(text, encoding='utf-8')

          html = (root / 'index.html').read_text(encoding='utf-8')
          weather_html = (root / 'weather.html').read_text(encoding='utf-8')
          history_html = (root / 'weather-history.html').read_text(encoding='utf-8')
          assert '/Jotrip-Lab/weather/weather-v2.css' in html
          assert '/Jotrip-Lab/weather/weather-v2.js' in html
          assert '/Jotrip-Lab/weather/weather-v2.css' in weather_html
          assert '/Jotrip-Lab/weather/weather-dashboard.css' not in html
          assert not (root / 'classic.html').exists()
          assert not any(root.glob('weather-dashboard*'))
          assert '/Jotrip-Lab/weather/weather-history.css' in history_html
          assert '/Jotrip-Lab/weather/weather-history.js' in history_html
          history_js = (root / 'weather-history.js').read_text(encoding='utf-8')
          assert 'raw.githubusercontent.com/kenzuko/Jotrip-Lab/data-weather/data/weather-nowcast' in history_js
          assert 'data-weather/Jotrip-Lab/weather/' not in history_js
          PY

      - name: Publish only Weather folder to gh-pages
        shell: bash
        working-directory: pages
        run: |
          set -euo pipefail
          rm -rf "$PAGES_DIR"
          mkdir -p "$PAGES_DIR"
          cp -a /tmp/weather-pages/. "$PAGES_DIR"/

          # Backward-compatible root aliases for weather.openphuquoc.com
          # or any older redirect that still targets /Jotrip-Lab/weather.html.
          cp /tmp/weather-pages/index.html weather.html
          cp /tmp/weather-pages/index.html weather-v2.html

          git config user.name "jotrip-weather-bot"
          git config user.email "jotrip-weather-bot@users.noreply.github.com"
          git add "$PAGES_DIR" weather.html weather-v2.html

          if git diff --cached --quiet; then
            echo "Weather Pages already current"
            exit 0
          fi

          git commit -m "deploy(weather): refresh GitHub Pages snapshot"

          for attempt in 1 2 3; do
            if git pull --rebase origin "$PAGES_REF" && git push origin "HEAD:$PAGES_REF"; then
              echo "Weather Lab published to gh-pages on attempt $attempt"
              exit 0
            fi
            echo "Publish attempt $attempt failed; retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done

          echo "Weather Lab gh-pages publish failed after 3 attempts"
          exit 1
