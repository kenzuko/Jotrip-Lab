name: Weather Nowcast Himawari
run-name: Himawari observed nowcast

on:
  schedule:
    - cron: "7,37 * * * *"
  push:
    paths:
      - "weather/collectors/himawari_nowcast.py"
      - "weather/processing/convective_proxy.py"
      - "weather/pipeline/archive_nowcast.py"
      - "weather/tests/test_convective_proxy.py"
      - "weather/tests/test_nowcast_archive.py"
      - ".github/workflows/weather-nowcast.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      target_ref:
        description: "Branch containing Weather Lab"
        required: false
        type: string
        default: "feat/weather-lab-data-engine-v1"

concurrency:
  group: weather-nowcast-${{ inputs.target_ref || github.ref_name }}
  # NOAA download may exceed 10 minutes: never abort an active ingestion.
  cancel-in-progress: false

permissions:
  contents: write

env:
  DATA_BRANCH: data-weather
  DATA_ROOT: data/weather-nowcast

jobs:
  himawari-nowcast:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref_name }}
          fetch-depth: 0

      - name: Restore compact Weather Nowcast state from data branch
        shell: bash
        run: |
          git fetch origin "$DATA_BRANCH" --depth=1
          git checkout "origin/$DATA_BRANCH" -- "$DATA_ROOT" || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install free NOAA/JMA satellite clients
        run: python -m pip install --quiet boto3 s3fs xarray h5netcdf h5py numpy pyproj

      - name: Test transparent convective signal and compact archive
        run: |
          python -m unittest weather.tests.test_convective_proxy -v
          python -m unittest weather.tests.test_nowcast_archive -v

      - name: Collect latest Himawari-9 cloud-top observations
        run: python -m weather.collectors.himawari_nowcast --output /tmp/nowcast.json

      - name: Validate isolated nowcast contract
        run: |
          python - <<'PY'
          import json
          from weather.points import POINTS
          p=json.load(open('/tmp/nowcast.json'))
          assert p['status'] in {'POINT_NUMERIC_READY','UNAVAILABLE'}, p
          assert p['lightning_observed']['status'] == 'NOT_CONNECTED', p
          if p['status'] == 'POINT_NUMERIC_READY':
              assert set(p['points']) == set(POINTS)
              spatial=p.get('spatial') or {}
              assert spatial.get('status') == 'READY', spatial
              assert spatial.get('cell_count',0) >= 200, spatial
              assert len(spatial.get('frames') or []) >= 1, spatial
              assert spatial.get('display_interpolation') == 'RENDER_ONLY', spatial
              assert all('convective_score' in cell for frame in spatial['frames'] for cell in frame['cells']), spatial
              for point in p['points'].values():
                  sig=point['convective_signal']
                  assert sig['level'] in {'LOW','WATCH','ELEVATED','HIGH'}
                  assert 0 <= sig['score'] <= 100
                  assert 'NOT_LIGHTNING_OBSERVATION' in sig['method']
          PY

      - name: Build Airport-style compact archive
        id: archive
        shell: bash
        run: |
          STATUS=$(python -c 'import json; print(json.load(open("/tmp/nowcast.json"))["status"])')
          if [[ "$STATUS" != "POINT_NUMERIC_READY" ]]; then
            echo "Himawari layer not ready ($STATUS); keeping last valid latest/history"
            python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('data/weather-nowcast')
          root.mkdir(parents=True, exist_ok=True)
          payload=json.load(open('/tmp/nowcast.json'))
          current={}
          p=root/'health.json'
          if p.exists():
              try: current=json.loads(p.read_text())
              except Exception: current={}
          current.update({
              'module':'JoTrip Weather Nowcast Archive',
              'state':'SOURCE_UNAVAILABLE',
              'archive_mode':'DAILY_RAW_PLUS_MATERIAL_EVENTS_PLUS_DAILY_SUMMARY',
              'full_snapshot_history':False,
              'last_attempt_at':datetime.now(timezone.utc).isoformat(),
              'detail':payload.get('detail'),
          })
          p.write_text(json.dumps(current,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            exit 0
          fi
          python -m weather.pipeline.archive_nowcast --snapshot /tmp/nowcast.json --root "$DATA_ROOT"

      - name: Persist compact Weather Nowcast state to isolated data branch
        if: always()
        shell: bash
        run: |
          if [ ! -d "$DATA_ROOT" ]; then
            echo 'No Weather Nowcast state to persist'
            exit 0
          fi

          rm -rf /tmp/weather-nowcast-export
          mkdir -p /tmp/weather-nowcast-export
          cp -a "$DATA_ROOT"/. /tmp/weather-nowcast-export/

          git reset --hard HEAD
          rm -rf "$DATA_ROOT"
          git fetch origin "$DATA_BRANCH"
          git checkout -B "$DATA_BRANCH" "origin/$DATA_BRANCH"
          mkdir -p "$DATA_ROOT"
          cp -a /tmp/weather-nowcast-export/. "$DATA_ROOT"/
          git config user.name "jotrip-weather-bot"
          git config user.email "jotrip-weather-bot@users.noreply.github.com"
          git add "$DATA_ROOT"

          if git diff --cached --quiet; then
            echo 'No Weather Nowcast data changes'
            exit 0
          fi

          git commit -m "data: update compact Weather Nowcast archive"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$DATA_BRANCH" && git push origin "HEAD:$DATA_BRANCH"; then
              echo "Weather Nowcast state persisted on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after backoff"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo 'Failed to persist Weather Nowcast state after 3 attempts'
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: himawari-nowcast
          path: /tmp/nowcast.json
          retention-days: 7
