name: Weather Nowcast Himawari
run-name: Himawari observed nowcast

on:
  schedule:
    - cron: "7,37 * * * *"
  push:
    paths:
      - "weather/collectors/himawari_nowcast.py"
      - "weather/processing/convective_proxy.py"
      - "weather/tests/test_convective_proxy.py"
      - "weather/nowcast.json"
      - ".github/workflows/weather-nowcast.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      target_ref:
        description: "Branch containing Weather Lab"
        required: false
        type: string
        default: "feat/weather-lab-data-engine-v1"

concurrency:
  group: weather-nowcast-${{ inputs.target_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  himawari-nowcast:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free NOAA/JMA satellite clients
        run: python -m pip install --quiet boto3 s3fs xarray h5netcdf h5py numpy pyproj
      - name: Test transparent convective signal
        run: python -m unittest weather.tests.test_convective_proxy -v
      - name: Collect latest Himawari-9 cloud-top observations
        run: python -m weather.collectors.himawari_nowcast --output /tmp/nowcast.json
      - name: Validate isolated nowcast contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/nowcast.json'))
          assert p['status'] in {'POINT_NUMERIC_READY','UNAVAILABLE'}, p
          assert p['lightning_observed']['status'] == 'NOT_CONNECTED', p
          if p['status'] == 'POINT_NUMERIC_READY':
              assert set(p['points']) == {'an_thoi','duong_dong','ganh_dau','rach_gia'}
              for point in p['points'].values():
                  sig=point['convective_signal']
                  assert sig['level'] in {'LOW','WATCH','ELEVATED','HIGH'}
                  assert 0 <= sig['score'] <= 100
                  assert 'NOT_LIGHTNING_OBSERVATION' in sig['method']
          PY
      - name: Publish only a valid satellite observation snapshot
        shell: bash
        run: |
          STATUS=$(python -c 'import json; print(json.load(open("/tmp/nowcast.json"))["status"])')
          if [[ "$STATUS" != "POINT_NUMERIC_READY" ]]; then
            echo "Himawari layer not ready ($STATUS); keeping last valid nowcast.json"
            cat /tmp/nowcast.json
            exit 0
          fi
          cp /tmp/nowcast.json weather/nowcast.json
          git config user.name "jotrip-weather-bot"
          git config user.email "jotrip-weather-bot@users.noreply.github.com"
          git add weather/nowcast.json
          if git diff --cached --quiet; then
            echo "Nowcast snapshot unchanged"
            exit 0
          fi
          git commit -m "chore(weather): publish Himawari nowcast snapshot [skip ci]"
          git pull --rebase origin "${{ inputs.target_ref || github.ref_name }}"
          git push origin "HEAD:${{ inputs.target_ref || github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: himawari-nowcast
          path: /tmp/nowcast.json
          retention-days: 7
