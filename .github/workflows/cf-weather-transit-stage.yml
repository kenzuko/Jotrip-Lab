name: Stage Weather and Transit on Cloudflare Pages
on:
  push:
    branches: [ops/cf-pages-migration-20261009]
    paths: [.github/workflows/cf-weather-transit-stage.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cf-weather-transit-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - repo: Jotrip-Weather
            project: openpq-weather-web
          - repo: transit-jotrip
            project: openpq-transit-web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT_NAME: ${{ matrix.project }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone original source and preserve static runtime and snapshot data
        shell: bash
        env:
          REPO: ${{ matrix.repo }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 https://github.com/kenzuko/"$REPO".git source-site
          mkdir -p candidate
          while IFS= read -r -d '' file; do
            rel="${file#source-site/}"
            case "$rel" in
              .git/*|.github/*|tests/*|scripts/*|collector/*|cloudflare/*|node_modules/*|.env*|*/.env*) continue;;
            esac
            case "$rel" in
              *.html|*.js|*.css|*.json|*.svg|*.png|*.jpg|*.jpeg|*.webp|*.avif|*.gif|*.ico|*.woff|*.woff2|*.ttf|*.webmanifest|*.txt|*.xml)
                mkdir -p "candidate/$(dirname "$rel")"
                cp "$file" "candidate/$rel";;
            esac
          done < <(find source-site -type f -print0)
          cat > candidate/_headers <<'HEADERS'
          /*
            X-Robots-Tag: noindex, nofollow, noarchive
          HEADERS
          test -s candidate/index.html
          if [ "$REPO" = 'Jotrip-Weather' ]; then
            test -s candidate/weather.js || test -s candidate/weather-live-config.js
            for f in candidate/weather*.js; do test -f "$f" && node --check "$f" || :; done
          else
            test -s candidate/app.js
            node --check candidate/app.js
          fi
          test -d candidate/data
          echo "SOURCE_REPO=$REPO SOURCE_SHA=$(git -C source-site rev-parse HEAD) FILES=$(find candidate -type f | wc -l)"
          du -sh candidate
      - name: Check Cloudflare Pages project
        id: existing
        run: |
          node --input-type=module <<'NODE'
          const fs=await import('node:fs');
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/pages/projects/'+process.env.CF_PROJECT_NAME;
          const r=await fetch(base,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
          const j=await r.json();
          if(r.status!==404 && !(r.ok&&j.success)) throw Error('Pages project lookup HTTP '+r.status+' CF='+(j.errors||[]).map(e=>e.code));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'exists='+(r.status!==404)+'\n');
          NODE
      - name: Create isolated Cloudflare Pages site
        if: steps.existing.outputs.exists == 'false'
        run: npx --yes wrangler@4 pages project create "$CF_PROJECT_NAME" --production-branch main
      - name: Upload static snapshot and UI to Cloudflare Pages only
        run: npx --yes wrangler@4 pages deploy candidate --project-name "$CF_PROJECT_NAME" --branch main
      - name: Probe static health with no production domain changes
        run: |
          set -euo pipefail
          base="https://$CF_PROJECT_NAME.pages.dev"
          if [ "${{ matrix.repo }}" = 'Jotrip-Weather' ]; then paths='/ /index.html'; else paths='/ /app.js /data/network.json'; fi
          for path in $paths; do
            code="$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "$base$path")"
            echo "$base$path HTTP=$code"
            test "$code" = 200
          done
          test "$(curl -sSI --max-time 20 "$base/" | tr -d '\r' | grep -ic '^x-robots-tag: noindex')" -gt 0
          echo "STAGING_OK=$base"
