name: Tourism Airfare Fallback

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tourism_intelligence_v2/collectors/airfare/**'
      - 'config/tourism_v2/airfare-sources.v1.json'
      - '.github/workflows/tourism-airfare-fallback.yml'
  schedule:
    # 05:20 and 17:20 Asia/Ho_Chi_Minh, ahead of 06:00 / 18:00 reports.
    - cron: '20 22 * * *'
    - cron: '20 10 * * *'

concurrency:
  group: tourism-airfare-fallback-data-writer
  cancel-in-progress: false

permissions:
  contents: write

env:
  DATA_BRANCH: data-airfare-fallback

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout production code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install free parser dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Collect public airfare fallback evidence
        run: python -m tourism_intelligence_v2.collectors.airfare.collector --output /tmp/airfare_fallback

      - name: Enforce fallback-only contract
        id: gate
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/airfare_fallback/latest.json', encoding='utf-8'))
          h=json.load(open('/tmp/airfare_fallback/health.json', encoding='utf-8'))
          assert p['eligible_for_airfare_pressure'] is False
          assert p['fixed_basket_compatible'] is False
          assert h['eligible_for_airfare_pressure'] is False
          print(json.dumps({'state':h['state'],'coverage':h['source_coverage'],'observations':len(p['observations'])},ensure_ascii=False,indent=2))
          with open('/tmp/airfare_state.txt','w',encoding='utf-8') as f:
              f.write(h['state'])
          PY
          echo "state=$(cat /tmp/airfare_state.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airfare-fallback-${{ github.run_id }}
          path: /tmp/airfare_fallback/**
          if-no-files-found: error
          retention-days: 14

      - name: Persist to isolated data branch
        if: always()
        shell: bash
        run: |
          test -d /tmp/airfare_fallback
          python - <<'PY'
          import json
          p='/tmp/airfare_fallback/health.json'
          h=json.load(open(p, encoding='utf-8'))
          h['commit_succeeded']=True
          with open(p,'w',encoding='utf-8') as f:
              json.dump(h,f,ensure_ascii=False,indent=2,sort_keys=True)
              f.write('\n')
          PY
          DAY=$(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d)
          STAMP=$(TZ=Asia/Ho_Chi_Minh date +%H%M)
          rm -rf /tmp/airfare-export
          mkdir -p /tmp/airfare-export
          cp -a /tmp/airfare_fallback/. /tmp/airfare-export/
          git fetch origin "$DATA_BRANCH" --depth=1
          git checkout -B "$DATA_BRANCH" "origin/$DATA_BRANCH"
          mkdir -p data/airfare_fallback/$DAY
          cp -a /tmp/airfare-export/. data/airfare_fallback/
          cp /tmp/airfare-export/latest.json data/airfare_fallback/$DAY/$STAMP.json
          git config user.name 'jotrip-airfare-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/airfare_fallback
          if git diff --cached --quiet; then
            echo 'No airfare fallback changes'
            exit 0
          fi
          git commit -m 'data: update public airfare fallback evidence'
          for attempt in 1 2 3; do
            if git pull --rebase origin "$DATA_BRANCH" && git push origin "HEAD:$DATA_BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo 'Failed to persist airfare fallback after 3 attempts'
          exit 1

      - name: Fail only when no usable fallback evidence exists
        if: steps.gate.outputs.state == 'DEGRADED'
        run: exit 1
