name: Airport Pages custom-domain verification
on:
  push:
    branches: [ops/cf-pages-migration-20261009]
    paths: [.github/workflows/cf-airport-domain-status.yml]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect Pages domain registration and DNS pointers
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const name='airport.openphuquoc.com';
          const u='https://api.cloudflare.com/client/v4/accounts/'+account+'/pages/projects/openpq-airport-web/domains/'+name;
          const r=await fetch(u,{headers:{Authorization:'Bearer '+token,Accept:'application/json'}});
          const j=await r.json();
          console.log('PAGES_DOMAIN_HTTP='+r.status+' SUCCESS='+!!j.success);
          console.log('DOMAIN_DETAILS='+JSON.stringify({
            name:j.result?.name,
            status:j.result?.status,
            validation_data:j.result?.validation_data,
            verification_data:j.result?.verification_data,
            errors:(j.errors||[]).map(x=>({code:x.code,message:x.message}))
          }));
          if(!r.ok||!j.success)process.exitCode=1;
          NODE

# Revalidate after owner DNS cutover (2026-10-09)
